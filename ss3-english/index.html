/* ================= A3: DIRECT AND REPORTED SPEECH ================= */
var REP_WORKED=[
 {q:'Musa said, "I am hungry."',tag:'1. Statement',a:'Musa said that he was hungry.',st:['Reporting verb: <b>said</b>. Reported words: I am hungry.','Remove the quotation marks and the comma. Add <b>that</b>.','Pronoun: <b>I</b> is Musa himself, so I → <b>he</b>.','Tense: <b>am</b> (present) → <b>was</b> (past).','Check: no quotation marks, pronoun and tense both changed.']},
 {q:'Ngozi said, "We are going to the market."',tag:'2. Statement',a:'Ngozi said that they were going to the market.',st:['Reporting verb: said. Reported words: We are going to the market.','We includes Ngozi and others, so we → <b>they</b>.','Present continuous → past continuous: are going → <b>were going</b>.','Add that. Remove quotation marks.','Place stays the same because it is not a here/there word.']},
 {q:'Mrs Eze said to the class, "I have marked your scripts."',tag:'3. Statement with “told”',a:'Mrs Eze told the class that she had marked their scripts.',st:['Because the class is named, use <b>told</b> instead of <b>said to</b>.','I → <b>she</b> (Mrs Eze). Your → <b>their</b> (the class).','Present perfect → past perfect: have marked → <b>had marked</b>.','Add that. Remove quotation marks.','The speaker and the listener both appear in the pronouns. Check both.']},
 {q:'Bayo said, "I will travel tomorrow."',tag:'4. Time change',a:'Bayo said that he would travel the next day.',st:['I → <b>he</b>.','will → <b>would</b>.','tomorrow → <b>the next day</b> (or the following day).','Add that. Remove quotation marks.','Never keep tomorrow in an exam answer unless the question says it is still tomorrow.']},
 {q:'Chidi said to me, "You can borrow my pen."',tag:'5. Pronouns: you and my',a:'Chidi told me that I could borrow his pen.',st:['said to me → <b>told me</b>.','<b>You</b> is the listener, who is me, so you → <b>I</b>.','<b>My</b> belongs to Chidi, so my → <b>his</b>.','can → <b>could</b>.','Check that every pronoun points to the right person.']},
 {q:'Uche said, "I saw her yesterday."',tag:'6. Simple past',a:'Uche said that he had seen her the day before.',st:['I → he. Her stays <b>her</b> (a third person does not change).','Simple past → <b>past perfect</b>: saw → <b>had seen</b>.','yesterday → <b>the day before</b> (or the previous day).','Add that. Remove quotation marks.','Use the past participle (seen) after had.']},
 {q:'The teacher said, "Water boils at 100 degrees Celsius."',tag:'7. A universal truth',a:'The teacher said that water boils at 100 degrees Celsius.',st:['This statement is always true.','When the words reported are a <b>fact that is always true</b>, the tense does not have to change.','Keep <b>boils</b> in the present.','Add that. Remove quotation marks.','Only do this for real general truths. Do not use it to avoid learning the tense changes.']},
 {q:'"Are you ready?" the coach asked Tunde.',tag:'8. Yes/no question',a:'The coach asked Tunde if he was ready.',st:['The reported words are a question that needs yes or no.','Use <b>if</b> or <b>whether</b> to join the sentences. <b>Do not use that.</b>','Change the word order to a statement: are you ready → <b>he was ready</b>.','You → he. Are → was.','Remove the question mark. The new sentence is a statement.']},
 {q:'"Where do you live?" Mr Adamu asked the boy.',tag:'9. Wh-question',a:'Mr Adamu asked the boy where he lived.',st:['Keep the question word: <b>where</b>.','Change the word order to a statement: do you live → <b>he lived</b>. Remove <b>do</b>.','You → he. Live → lived.','Do not add that or if. Remove the question mark.','Check: where he lived, not where did he live.']},
 {q:'"What did you eat this morning?" the doctor asked Zainab.',tag:'10. Wh-question + time',a:'The doctor asked Zainab what she had eaten that morning.',st:['Keep the question word: <b>what</b>.','Statement order: you did eat → <b>she had eaten</b>. Simple past in the question → past perfect.','You → she.','this morning → <b>that morning</b>.','No that, no question mark.']},
 {q:'Amaka said to him, "Have you seen my bag?"',tag:'11. Question with “said to”',a:'Amaka asked him if he had seen her bag.',st:['The words are a question, so the reporting verb becomes <b>asked</b>.','Use <b>if</b> or <b>whether</b>.','You → he. My → her. Present perfect → past perfect: have seen → <b>had seen</b>.','Statement order: if he had seen her bag.','Remove the question mark.']},
 {q:'"Close the door," the teacher said to Bayo.',tag:'12. Command',a:'The teacher told Bayo to close the door.',st:['A command uses <b>told</b> or <b>ordered</b>.','The listener (Bayo) comes right after the reporting verb.','Use <b>to + the base verb</b>: to close.','Do not use that. Do not keep the comma or quotation marks.','Check: told Bayo to close.']},
 {q:'"Do not shout," the prefect said to the pupils.',tag:'13. Negative command',a:'The prefect told the pupils not to shout.',st:['Negative command: use <b>not to</b> + the base verb.','told the pupils <b>not to shout</b>.','Do not write told the pupils to not shout. Many examiners consider it weak.','Remove quotation marks and the comma.','Check the doer: the prefect gives the order.']},
 {q:'"Please lend me your ruler," Halima said to Segun.',tag:'14. Request',a:'Halima asked Segun to lend her his ruler.',st:['A request uses <b>asked</b> (or requested, begged).','Please is dropped. A polite request is shown by asked.','Me → her (Halima). Your → his (Segun).','Use asked + person + <b>to</b> + base verb.','Remove quotation marks.']},
 {q:'"Stand up at once!" the officer said to the soldiers.',tag:'15. Strong command',a:'The officer ordered the soldiers to stand up at once.',st:['A strong command uses <b>ordered</b> (or commanded).','ordered + the soldiers + <b>to</b> + stand up.','Keep at once. It shows the force of the order.','Remove the exclamation mark and quotation marks.','The reporting verb shows how the words were said.']},
 {q:'"What a lovely dress!" Ada said.',tag:'16. Exclamation',a:'Ada exclaimed that it was a lovely dress.  (or: Ada exclaimed with admiration that it was a very lovely dress.)',st:['An exclamation shows strong feeling.','Use a reporting verb like <b>exclaimed</b> or <b>cried</b>, or say the feeling: with joy, with sorrow, with admiration.','What a lovely dress → that it was a lovely dress (you can add very).','Remove the exclamation mark.','Use that to join the parts.']},
 {q:'"Hurray! We have won!" the boys shouted.',tag:'17. Exclamation',a:'The boys shouted with joy that they had won.',st:['Hurray shows joy. Replace the word with <b>with joy</b>.','We → they. Present perfect → past perfect: have won → <b>had won</b>.','Add that. Remove the exclamation marks.','The reporting verb is the same, shouted.','Notice how Hurray disappeared and with joy replaced it.']}
];
SEC('a3','Part A: Sentence recasting','Direct and reported speech','Report what people said without using their exact words.',[
 SC('Direct speech and reported speech',
  DEF('<b>Direct speech</b> gives the <b>exact words</b> a person said. It uses quotation marks.','Direct speech'),
  DEF('<b>Reported speech</b> (also called indirect speech) tells <b>what a person said</b>, without quotation marks and often with changes.','Reported speech'),
  EX(`<b>Direct:</b> Musa said, “I am hungry.”<br><b>Reported:</b> Musa said that he was hungry.`),
  P('In both sentences, <b>said</b> is the <b>reporting verb</b>. The words that follow are the <b>reported clause</b>.'),
  P('Three things usually change when you move from direct to reported speech: <b>pronouns</b>, <b>tenses</b> and <b>time/place words</b>. We learn them one at a time.')),
 SC('Change 1: pronouns',
  P('A pronoun must point to the right person from the <b>reporter’s</b> point of view.'),
  TB(['Direct','Reported','Example'],[
   ['I','he / she','Musa said, “<b>I</b> am hungry.” → Musa said that <b>he</b> was hungry.'],
   ['we','they','Ngozi said, “<b>We</b> are late.” → Ngozi said that <b>they</b> were late.'],
   ['my','his / her','Tayo said, “<b>My</b> bag is new.” → Tayo said that <b>his</b> bag was new.'],
   ['our','their','The boys said, “<b>Our</b> teacher is here.” → The boys said that <b>their</b> teacher was there.'],
   ['you / your','I / he / she / they … (depends on who is listening)','Ada said to me, “<b>You</b> are late.” → Ada told me that <b>I</b> was late.'],
   ['he, she, they','No change','Bola said, “<b>She</b> is clever.” → Bola said that <b>she</b> was clever.']
  ]),
  TIP('Use this rule: <b>I/we</b> → the speaker. <b>You</b> → the listener. <b>He/she/they</b> → no change.')),
 SC('Change 2: tenses',
  P('When the reporting verb is in the past (said, told, asked…), the verb in the reported clause usually moves <b>one step back</b> in time. This is sometimes called <b>backshift</b>.'),
  TB(['Direct speech','Reported speech','Example'],[
   ['Simple present','Simple past','“I <b>eat</b>.” → he said that he <b>ate</b>.'],
   ['Present continuous','Past continuous','“I <b>am eating</b>.” → he said that he <b>was eating</b>.'],
   ['Present perfect','Past perfect','“I <b>have eaten</b>.” → he said that he <b>had eaten</b>.'],
   ['Simple past','Past perfect (where appropriate)','“I <b>ate</b>.” → he said that he <b>had eaten</b>.'],
   ['will','would','“I <b>will</b> go.” → he said that he <b>would</b> go.'],
   ['can','could','“I <b>can</b> swim.” → he said that he <b>could</b> swim.'],
   ['may','might','“I <b>may</b> come.” → he said that he <b>might</b> come.'],
   ['must','had to (or must)','“I <b>must</b> go.” → he said that he <b>had to</b> go.']
  ]),
  TIP('<b>would, could, might, should, ought to</b> do not change again. They are already one step back.')),
 SC('Change 3: time and place words',
  P('Time and place words change because the reporter is speaking at a <b>different time and place</b> from the original speaker.'),
  TB(['Direct','Reported'],[
   ['today','that day'],['tonight','that night'],['now','then'],['yesterday','the previous day / the day before'],['tomorrow','the next day / the following day'],
   ['last week','the previous week / the week before'],['next week','the following week / the week after'],['ago','before'],['here','there'],['this','that'],['these','those']
  ]),
  MIS('Students report tomorrow as <s>tomorrow</s> in an exam. Always change it to <b>the next day</b> or <b>the following day</b>.')),
 SC('When the tense does not change',
  P('The tenses do not always change. They stay the same when:'),
  STP(['The words are a <b>universal truth</b> or a general fact: <em>The teacher said that water boils at 100 degrees Celsius.</em>','The reporting verb is in the <b>present</b> or future: <em>She says that she is tired.</em>','The verb is already one of <b>would, could, might, should, ought to</b>.']),
  P('Time words also depend on the situation. If you report the words on the <b>same day</b>, you can keep <b>today</b> or <b>tomorrow</b>. In examinations, assume the reporting is done later, so change them.'),
  QZ('a3-tense','Quick check: tense changes','live',[
   M('a3t1','reported','<b>1.</b> In reported speech, <em>will</em> becomes…',['would','shall','can','did'],0,'will → would. It moves one step back.',{1:'Shall is not the usual backshift of will.',2:'Can is a different modal.',3:'Did is the past of do, not of will.'}),
   M('a3t2','reported','<b>2.</b> In reported speech, <em>tomorrow</em> becomes…',['yesterday','the next day','today','now'],1,'tomorrow → the next day (or the following day).',{0:'Yesterday is a past time word, and it changes to the day before.',2:'Today becomes that day.',3:'Now becomes then.'}),
   M('a3t3','reported','<b>3.</b> Which statement keeps the present tense correctly?',['The teacher said that water boils at 100 degrees Celsius.','The teacher said that the school was opening on Monday.','The teacher said that he is ill.','The teacher said that he can come.'],0,'A universal truth keeps its present tense. The other options report personal statements, so the tense should move back.',{1:'This one is not a universal truth.',2:'Personal state of health, not a universal truth. In exams, change it to was ill.',3:'Can → could in reported speech.'})
  ])),
 SC('Said, told, asked, ordered',
  P('The <b>reporting verb</b> must match the type of sentence.'),
  TB(['Reporting verb','Used for','Example'],[
   ['said','statements; no person right after it','She <b>said</b> that she was tired. / She <b>said to me</b> that…'],
   ['told','statements, commands; a person must follow','She <b>told me</b> that she was tired.'],
   ['asked','questions and polite requests','He <b>asked</b> where I lived.'],
   ['ordered / commanded','strong commands','The officer <b>ordered</b> them to stand.'],
   ['begged / requested','requests','She <b>begged</b> him to stay.']
  ]),
  MIS('<s>She said me that she was tired.</s> <b>Said</b> cannot be followed directly by a person. Use <b>told me</b> or <b>said to me</b>.'),
  QZ('a3-verbs','Quick check: reporting verbs','live',[
   M('a3v1','reported','Choose the correct sentence.',['She said me that she was ready.','She told me that she was ready.','She told that she was ready.','She said to that she was ready.'],1,'Told needs a person after it: told me.',{0:'Said cannot take a person directly. Say said to me, or use told me.',2:'Told needs a person after it.',3:'Said to needs a person after to.'})
  ])),
 SC('Reporting questions',
  P('A <b>question</b> becomes a <b>statement</b> when reported. Keep these rules:'),
  STP(['The reporting verb is usually <b>asked</b>.','Yes/no questions: join with <b>if</b> or <b>whether</b>.','Wh-questions (who, what, where, why, when, how): keep the question word.','Change the word order to a <b>statement</b> (subject before verb). Remove do/does/did.','Remove the question mark.','Do not use <b>that</b> in a reported question.']),
  TB(['Direct question','Reported question'],[
   ['“Are you tired?” Ada asked him.','Ada asked him <b>if</b> he was tired.'],
   ['“Where do you live?” he asked me.','He asked me <b>where</b> I lived.'],
   ['“Why did you come late?” the teacher asked.','The teacher asked <b>why</b> he had come late.']
  ]),
  MIS('<s>He asked where was I going.</s> Do not keep the question order. Write <b>He asked where I was going.</b>'),
  MIS('<s>She asked that where I lived.</s> Never put <b>that</b> before the question word.')),
 SC('Reporting commands, requests and exclamations',
  H('Commands'),
  P('<b>Told/ordered + person + to + base verb.</b> For negatives, <b>not to</b>.'),
  EX('“Sit down,” the teacher said to Bola. → The teacher <b>told</b> Bola <b>to sit down</b>.<br>“Do not run,” she said to the children. → She told the children <b>not to run</b>.'),
  H('Requests'),
  P('<b>Asked/begged/requested + person + to + base verb.</b> Please is dropped.'),
  EX('“Please help me,” Tayo said to Ngozi. → Tayo <b>asked</b> Ngozi <b>to help</b> him.'),
  H('Exclamations'),
  P('Use a verb like <b>exclaimed</b>, <b>cried</b> or <b>shouted</b>, and name the feeling: <b>with joy, with sorrow, with surprise</b>.'),
  EX('“Alas! I have lost my phone,” said Chika. → Chika exclaimed <b>with sorrow</b> that she had lost her phone.'),
  QZ('a3-types','Quick check: sentence types','live',[
   M('a3q1','reported','Which reporting verb is best for: <em>“Please wait here,” she said to him.</em>?',['ordered','asked','exclaimed','replied'],1,'Please shows a polite request, so asked.',{0:'Ordered is for strong commands. Please makes this a polite request.',2:'Exclaimed shows strong feeling.',3:'Replied answers a question. This is not an answer.'}),
   M('a3q2','reported','Which is the correct report of <em>“Do not touch it,” he said to me.</em>',['He told me do not touch it.','He told me to not touch it.','He told me not to touch it.','He said me not to touch it.'],2,'Negative command: told + person + not to + base verb.',{0:'Do not keep the command form. Use not to + verb.',1:'Not to touch is the standard form. Avoid to not.',3:'Said cannot take me directly. Use told me.'})
  ])),
 SC('Seventeen worked examples',
  P('Try each one first, then reveal the steps. Study the pronouns and tenses carefully.'),
  WK('Worked examples',REP_WORKED)),
 SC('Mistakes to avoid',
  MIS('Keeping the quotation marks.<br>✘ <s>Musa said that “he was hungry.”</s><br>✔ Musa said that he was hungry.'),
  MIS('Forgetting to change the pronoun.<br>✘ <s>Musa said that I was hungry.</s><br>✔ Musa said that he was hungry.'),
  MIS('Forgetting to move the tense back.<br>✘ <s>Musa said that he is hungry.</s> (in an exam)<br>✔ Musa said that he was hungry.'),
  MIS('Using that in a reported question.<br>✘ <s>He asked that where I lived.</s><br>✔ He asked where I lived.'),
  MIS('Keeping the question order.<br>✘ <s>He asked where did I live.</s><br>✔ He asked where I lived.'),
  MIS('Saying <s>said me</s>.<br>✔ He told me. ✔ He said to me.'),
  MIS('Leaving tomorrow, yesterday, here or now unchanged.<br>✔ the next day, the day before, there, then.')),
 SC('Practice 1: beginner questions',
  QZ('a3-beg','Beginner: reported speech','live',[
   M('a3b1','reported','<b>1.</b> Choose the reported form of: <em>Ibrahim said, “I am tired.”</em>',['Ibrahim said that I was tired.','Ibrahim said that he was tired.','Ibrahim said that he had been tired.','Ibrahim said he will be tired.'],1,'I → he and am → was.',{0:'I must change to he. Ibrahim is the person speaking.',2:'Am becomes was. Had been is too far back.',3:'Will be changes the time. The tense should be past.'}),
   M('a3b2','reported','<b>2.</b> In reported speech, <em>now</em> becomes…',['then','here','today','later'],0,'now → then.',{1:'Here is a place word. It becomes there.',2:'Today becomes that day.',3:'Later does not replace now.'}),
   M('a3b3','reported','<b>3.</b> Choose the correct sentence.',['She said me that she was ready.','She told me that she was ready.','She told that she was ready.','She said to that she was ready.'],1,'Told needs a person after it.',{0:'Said cannot be followed by me. Use told me or said to me.',2:'Told needs a person: told me.',3:'Said to needs a person after to.'}),
   M('a3b4','reported','<b>4.</b> In reported speech, <em>can</em> becomes…',['could','will','must','did'],0,'can → could.',{1:'Will changes to would, not from can.',2:'Must is a different modal.',3:'Did is not a modal.'}),
   M('a3b5','reported','<b>5.</b> Which reporting verb is most suitable for a <b>question</b>?',['told','ordered','asked','said'],2,'Questions are reported with asked.',{0:'Told is for statements and commands.',1:'Ordered is for strong commands.',3:'Said is used for statements.'})
  ],'Choose the best answer.')),
 SC('Practice 2: intermediate questions',
  P('Type the full reported sentence. Do <b>not</b> use quotation marks.'),
  QZ('a3-int','Intermediate: change to reported speech','live',[
   W('a3i1','reported','<b>1.</b> Kemi said, “I am cooking now.”',['Kemi said that she was cooking then.'],'I → she, am cooking → was cooking, now → then.',{noq:true,hint:'Change I, the tense and now.',traps:[{re:/was cooking now/,m:'Change now to then.'},{re:/is cooking/,m:'Move the tense back: is/am cooking → was cooking.'}]}),
   W('a3i2','reported','<b>2.</b> The boys said, “We have finished our homework.”',['The boys said that they had finished their homework.'],'We → they, our → their, have finished → had finished.',{noq:true,hint:'Change we, our and the tense.',traps:[{re:/had finished our/,m:'Our must change to their.'},{re:/have finished/,m:'Present perfect moves back to past perfect: had finished.'}]}),
   W('a3i3','reported','<b>3.</b> “Are you coming to the party?” Bisi asked Tola.',['Bisi asked Tola if she was coming to the party.','Bisi asked Tola whether she was coming to the party.'],'A yes/no question → if or whether, statement order, you → she, are → was.',{noq:true,hint:'Use if or whether. No question mark.',traps:[{re:/that/,m:'Do not use that in a reported question. Use if or whether.'},{re:/was she/,m:'Use statement order: she was coming, not was she coming.'}]}),
   W('a3i4','reported','<b>4.</b> Mr Yusuf said to the pupils, “Open your books.”',['Mr Yusuf told the pupils to open their books.'],'Command → told + person + to + base verb. Your → their.',{noq:true,hint:'Use told + the pupils + to + verb.',traps:[{re:/open your/,m:'Your must change to their.'},{re:/that/,m:'Do not use that for a command. Use to + verb.'}]}),
   W('a3i5','reported','<b>5.</b> Chika said, “I met him last week.”',['Chika said that she had met him the previous week.','Chika said that she had met him the week before.'],'I → she. Met → had met. Last week → the previous week / the week before.',{noq:true,hint:'Change I, met and last week.',traps:[{re:/last week/,m:'Change last week to the previous week or the week before.'},{re:/she met/,m:'Move the past tense back: had met.'}]})
  ],'Type the reported sentence.')),
 SC('Practice 3: WAEC and JAMB standard',
  P('Ten mixed questions: statements, questions, commands and requests. Read carefully.'),
  QZ('a3-exam','Exam standard: reported speech','live',[
   W('a3e1','reported','<b>1.</b> The principal said to the students, “You will write the test tomorrow.”',['The principal told the students that they would write the test the next day.','The principal told the students that they would write the test the following day.'],'You → they, will → would, tomorrow → the next/following day. Said to → told.',{noq:true,hint:'Change you, will and tomorrow. Use told.',traps:[{re:/tomorrow/,m:'Change tomorrow to the next day or the following day.'},{re:/will write/,m:'Will changes to would.'}]}),
   W('a3e2','reported','<b>2.</b> “Why did you leave early?” the manager asked the clerk.',['The manager asked the clerk why he had left early.'],'Wh-question: keep why, statement order, did leave → had left, you → he.',{noq:true,hint:'Keep why. Use statement order. Past → past perfect.',traps:[{re:/why did/,m:'Remove did. Use statement order: why he had left.'},{re:/why he left/,m:'Move the tense back. Left → had left.'}]}),
   W('a3e3','reported','<b>3.</b> “Don’t touch the machine,” the engineer warned the boys.',['The engineer warned the boys not to touch the machine.','The engineer told the boys not to touch the machine.'],'Negative command → not to + verb.',{noq:true,hint:'Use not to + the base verb.',traps:[{re:/dont|do not/,m:'Do not keep the command form. Use not to + verb.'}]}),
   W('a3e4','reported','<b>4.</b> Funke said to her mother, “My friends are coming here tonight.”',['Funke told her mother that her friends were coming there that night.'],'My → her. are coming → were coming. here → there. tonight → that night.',{noq:true,hint:'Four changes: my, tense, here, tonight.',traps:[{re:/here/,m:'Here becomes there.'},{re:/tonight/,m:'Tonight becomes that night.'}]}),
   W('a3e5','reported','<b>5.</b> “How far is the market from here?” the stranger asked me.',['The stranger asked me how far the market was from there.'],'Keep how far. Statement order. is → was. here → there.',{noq:true,hint:'Keep how far. Change is, and here.',traps:[{re:/how far was the market from here/,m:'Change here to there.'},{re:/how far is/,m:'Move the tense back. is → was.'}]}),
   W('a3e6','reported','<b>6.</b> “I can solve this problem,” said Obi.',['Obi said that he could solve that problem.'],'I → he. can → could. this → that.',{noq:true,hint:'Change I, can and this.',traps:[{re:/this problem/,m:'This becomes that.'},{re:/can solve/,m:'Can becomes could.'}]}),
   W('a3e7','reported','<b>7.</b> “Please wait outside,” the secretary said to the visitors.',['The secretary asked the visitors to wait outside.','The secretary requested the visitors to wait outside.'],'A polite request → asked/requested + person + to + verb.',{noq:true,hint:'Use asked and to + verb.',traps:[{re:/told|ordered/,m:'Please shows a polite request, so use asked.'}]}),
   W('a3e8','reported','<b>8.</b> The woman said, “My son was admitted to hospital yesterday.”',['The woman said that her son had been admitted to hospital the day before.','The woman said that her son had been admitted to hospital the previous day.'],'My → her. was admitted → had been admitted. yesterday → the day before.',{noq:true,hint:'Past passive moves back to had been + participle.',traps:[{re:/yesterday/,m:'Yesterday becomes the day before or the previous day.'},{re:/was admitted/,m:'Simple past moves back to past perfect: had been admitted.'}]}),
   W('a3e9','reported','<b>9.</b> “Hurray! I have passed!” cried Sade.',['Sade cried with joy that she had passed.','Sade shouted with joy that she had passed.','Sade exclaimed with joy that she had passed.'],'Hurray becomes with joy. I → she. have passed → had passed.',{noq:true,hint:'Replace Hurray with with joy. Change I and the tense.',traps:[{re:/hurray/,m:'Replace Hurray with the feeling: with joy.'}]}),
   W('a3e10','reported','<b>10.</b> The nurse said to the patient, “Take this medicine after meals.”',['The nurse told the patient to take that medicine after meals.'],'Command → told + person + to + verb. this → that.',{noq:true,hint:'Use told, to + verb, and change this.',traps:[{re:/this medicine/,m:'This becomes that.'},{re:/that the patient/,m:'Do not use that for a command. Use to + verb.'}]})
  ],'Type the reported sentence. Do not use quotation marks.'))
]);

function U(x){return '<u class="ul">'+x+'</u>'}
/* ================= B1: WORD CLASS vs FUNCTION ================= */
SEC('b1','Part B: Grammatical function','Word class or grammatical function?','Two different questions about the same word.',[
 SC('Two different questions',
  DEF('<b>Word class</b> asks: <b>What kind of word is this?</b> (noun, verb, adjective, adverb…). The answer belongs to the word itself.','Word class'),
  DEF('<b>Grammatical function</b> asks: <b>What job is this word, phrase or clause doing in this sentence?</b> (subject, object, complement, adverbial…). The answer depends on the sentence.','Grammatical function'),
  EX('The word <b>teacher</b> is always a noun. That is its word class.<br>But in one sentence it may be the <b>subject</b>, and in another it may be the <b>object</b>. That is its function.'),
  TIP('If the question says <b>“What is the function of…”</b>, never answer with <s>noun</s>, <s>verb</s> or <s>adverb</s>. Those are word classes. Answer with <b>subject, object, complement, adverbial</b>, and so on.')),
 SC('Same words, different jobs',
  P('Look at the same noun phrase <b>the boy</b> doing different jobs:'),
  TB(['Sentence','Underlined part','Function'],[
   [`${U('The boy')} ran home.`,'The boy','<b>Subject</b> (it does the running)'],
   [`She saw ${U('the boy')}.`,'the boy','<b>Direct object</b> (it receives the seeing)'],
   [`She gave ${U('the boy')} a book.`,'the boy','<b>Indirect object</b> (it receives the book)'],
   [`He is ${U('a teacher')}.`,'a teacher','<b>Subject complement</b> (it describes he)'],
   [`They arrived ${U('early')}.`,'early','<b>Adverbial</b> (it tells when)']
  ]),
  P('<b>The function changes when the sentence changes.</b> Never judge a word out of the sentence.'),
  QZ('b1-q','Quick check','live',[
   M('b1q1','function',`What is the <b>function</b> of ${U('the boy')} in: <em>She saw the boy.</em>?`,['Noun','Subject','Direct object','Adjective'],2,'The boy receives the action of seeing. It is the direct object. Noun is its word class, not its function.',{0:'Noun is the word class. The question asks for the job it does in the sentence.',1:'Who saw? She. The boy is not the doer.',3:'The boy is a noun phrase, not an adjective.'}),
   M('b1q2','function',`What is the <b>function</b> of ${U('early')} in: <em>They arrived early.</em>?`,['Adjective','Adverb','Adverbial','Subject'],2,'Early tells when. Its function is adverbial. (Adverb is its word class.)',{1:'Adverb is its word class. The question asks for its function.',0:'Here early describes the verb arrived, so it works as an adverbial.',3:'The subject is They.'})
  ]))
]);

/* ================= B2: THE TWELVE FUNCTIONS ================= */
function FNQ(id,q,opts,a,why){return M(id,'function',q,opts,a,why)}
SEC('b2','Part B: Grammatical function','The twelve grammatical functions','Learn each job one at a time.',[
 SC('1. Subject',
  DEF('The <b>subject</b> is the person or thing that does the action or that the sentence is about.'),
  P('<b>How to identify it:</b> find the verb. Ask <b>who or what + verb?</b>'),
  TB(['Sentence','Subject','Why?'],[
   [`${U('Ngozi')} sings well.`,'Ngozi','Who sings? Ngozi.'],
   [`${U('The old man in the shop')} sold me bread.`,'The old man in the shop','Who sold? The whole phrase, not just man.'],
   [`${U('Reading novels')} improves your vocabulary.`,'Reading novels','What improves? Reading novels.']
  ]),
  MIS('Students underline only the first word. A subject can be a long phrase. Take <b>everything</b> that answers “who or what + verb?”'),
  QZ('b2-1','Quick check','live',[FNQ('b2f1',`What is the function of ${U('The old man in the shop')} in: <em>The old man in the shop sold me bread.</em>?`,['Subject','Direct object','Adverbial','Subject complement'],0,'Who sold me bread? The old man in the shop. That is the subject.')])),
 SC('2. Direct object',
  DEF('The <b>direct object</b> is the person or thing that <b>receives the action</b> of the verb.'),
  P('<b>How to identify it:</b> ask <b>verb + what or whom?</b>'),
  TB(['Sentence','Direct object','Why?'],[
   [`Tola kicked ${U('the ball')}.`,'the ball','Kicked what? The ball.'],
   [`The farmer sells ${U('yams')}.`,'yams','Sells what? Yams.'],
   [`She saw ${U('the boy')}.`,'the boy','Saw whom? The boy.']
  ]),
  MIS('A direct object is not always a thing. People can be direct objects too. Also, the verb <b>be</b> (is, am, was) has no object. What follows it is a complement.'),
  QZ('b2-2','Quick check','live',[FNQ('b2f2',`What is the function of ${U('the ball')} in: <em>Tola kicked the ball.</em>?`,['Subject','Indirect object','Adverbial of place','Direct object'],3,'Kicked what? The ball. It receives the action, so it is the direct object.')])),
 SC('3. Indirect object',
  DEF('The <b>indirect object</b> is the person who <b>receives</b> the direct object, or who the action is done for. It comes before the direct object.'),
  P('<b>How to identify it:</b> find the direct object first. Then ask <b>to or for whom?</b> The verb has two objects.'),
  TB(['Sentence','Indirect object','Direct object'],[
   [`She gave ${U('the boy')} a book.`,'the boy','a book'],
   [`Mum bought ${U('Tayo')} a bag.`,'Tayo','a bag'],
   [`The teacher told ${U('us')} a story.`,'us','a story']
  ]),
  MIS('If the person comes <b>after “to” or “for”</b>, as in <em>She gave a book to the boy</em>, then <b>to the boy</b> is a prepositional phrase. Use the position test: an indirect object comes <b>before</b> the direct object without a preposition.'),
  QZ('b2-3','Quick check','live',[FNQ('b2f3',`What is the function of ${U('Tayo')} in: <em>Mum bought Tayo a bag.</em>?`,['Direct object','Subject complement','Indirect object','Object of a preposition'],2,'The bag is bought for Tayo. Tayo is the receiver of the direct object (a bag), so he is the indirect object.')])),
 SC('4. Subject complement',
  DEF('A <b>subject complement</b> completes the meaning of the subject. It <b>describes or renames the subject</b>. It follows a <b>linking verb</b> (be, become, seem, look, feel, smell, taste).'),
  P('<b>How to identify it:</b> check that it <b>means the same thing as the subject</b> or describes the subject.'),
  TB(['Sentence','Subject complement','Why?'],[
   [`He is ${U('a teacher')}.`,'a teacher','a teacher = he'],
   [`The soup smells ${U('delicious')}.`,'delicious','It describes the soup.'],
   [`Ngozi became ${U('the captain')}.`,'the captain','the captain = Ngozi']
  ]),
  MIS('Do not call it an object. <b>Be</b> and linking verbs do not take objects. The word after them tells what the subject <b>is</b> or <b>is like</b>.'),
  QZ('b2-4','Quick check','live',[FNQ('b2f4',`What is the function of ${U('delicious')} in: <em>The soup smells delicious.</em>?`,['Adverbial of manner','Subject complement','Direct object','Object complement'],1,'Smells is a linking verb here. Delicious describes the soup, the subject.')])),
 SC('5. Object complement',
  DEF('An <b>object complement</b> comes after the object and <b>describes or renames the object</b>.'),
  P('<b>How to identify it:</b> find the object first. The complement tells you what the object <b>becomes, is called or is made to be</b>.'),
  TB(['Sentence','Object','Object complement'],[
   [`They elected Musa ${U('captain')}.`,'Musa','captain'],
   [`The news made her ${U('happy')}.`,'her','happy'],
   [`We call the dog ${U('Rex')}.`,'the dog','Rex']
  ]),
  MIS('Do not confuse it with an indirect object. In <em>They elected Musa captain</em>, captain = Musa (object complement). In <em>She gave Musa a book</em>, a book ≠ Musa (direct object).'),
  QZ('b2-5','Quick check','live',[FNQ('b2f5',`What is the function of ${U('captain')} in: <em>They elected Musa captain.</em>?`,['Subject complement','Indirect object','Object complement','Adverbial of time'],2,'Captain describes what Musa has become. It renames the object, so it is an object complement.')])),
 SC('6. Adverbial of time',
  DEF('An <b>adverbial of time</b> tells <b>when</b> or <b>how often</b> something happens.'),
  P('<b>How to identify it:</b> ask <b>when?</b> or <b>how often?</b>'),
  TB(['Sentence','Adverbial of time','Why?'],[
   [`She arrived ${U('yesterday')}.`,'yesterday','Arrived when?'],
   [`We will meet ${U('after school')}.`,'after school','Meet when?'],
   [`He visits his uncle ${U('every Sunday')}.`,'every Sunday','How often?']
  ]),
  MIS('<b>Time</b> can hide inside a phrase. In <em>after school</em>, the word school is the object of the preposition after, but the <b>whole phrase</b> is the adverbial of time. Answer for the whole group of words the question underlines.'),
  QZ('b2-6','Quick check','live',[FNQ('b2f6',`What is the function of ${U('after school')} in: <em>We will meet after school.</em>?`,['Adverbial of place','Adverbial of time','Adverbial of manner','Subject'],1,'Meet when? After school. It tells the time.')])),
 SC('7. Adverbial of place',
  DEF('An <b>adverbial of place</b> tells <b>where</b> something happens.'),
  P('<b>How to identify it:</b> ask <b>where?</b>'),
  TB(['Sentence','Adverbial of place','Why?'],[
   [`The children play ${U('in the compound')}.`,'in the compound','Play where?'],
   [`They live ${U('near the market')}.`,'near the market','Live where?'],
   [`Put the book ${U('here')}.`,'here','Put it where?']
  ]),
  MIS('The prepositional phrase <b>in the compound</b> contains the object of a preposition (the compound), but the <b>whole phrase</b> is an adverbial of place. Read the question to see which one is asked.'),
  QZ('b2-7','Quick check','live',[FNQ('b2f7',`What is the function of ${U('in the compound')} in: <em>The children play in the compound.</em>?`,['Adverbial of place','Adverbial of time','Direct object','Subject complement'],0,'Play where? In the compound.')])),
 SC('8. Adverbial of manner',
  DEF('An <b>adverbial of manner</b> tells <b>how</b> something is done.'),
  P('<b>How to identify it:</b> ask <b>how?</b>'),
  TB(['Sentence','Adverbial of manner','Why?'],[
   [`She spoke ${U('softly')}.`,'softly','Spoke how?'],
   [`He answered ${U('with confidence')}.`,'with confidence','Answered how?'],
   [`The boys left ${U('in a hurry')}.`,'in a hurry','Left how?']
  ]),
  MIS('Do not mix up <b>manner</b> with <b>place</b> or <b>time</b>. If the best question is <b>how?</b> (softly, quickly, with care), it is manner. Many students call every adverb an adverbial of manner.'),
  QZ('b2-8','Quick check','live',[FNQ('b2f8',`What is the function of ${U('softly')} in: <em>She spoke softly.</em>?`,['Adverbial of time','Adverbial of place','Subject complement','Adverbial of manner'],3,'Spoke how? Softly. It describes the way she spoke.')])),
 SC('9. Adverbial of reason',
  DEF('An <b>adverbial of reason</b> tells <b>why</b> something happens.'),
  P('<b>How to identify it:</b> ask <b>why?</b> Look for words like <b>because, since, owing to, because of</b>.'),
  TB(['Sentence','Adverbial of reason','Why?'],[
   [`He was late ${U('because the bus broke down')}.`,'because the bus broke down','Late why? (a clause)'],
   [`She was absent ${U('owing to illness')}.`,'owing to illness','Absent why? (a phrase)'],
   [`We stayed indoors ${U('because of the rain')}.`,'because of the rain','Stayed why? (a phrase)']
  ]),
  MIS('<b>Because</b> is followed by a clause (<em>because he was sick</em>). <b>Because of</b> and <b>owing to</b> are followed by a noun phrase (<em>because of the rain</em>). Both tell <b>why</b>, so both are adverbials of reason.'),
  QZ('b2-9','Quick check','live',[FNQ('b2f9',`What is the function of ${U('because he was sick')} in: <em>He stayed at home because he was sick.</em>?`,['Adverbial of reason','Adverbial of manner','Direct object','Adverbial of time'],0,'Stayed at home why? Because he was sick.')])),
 SC('10. Object of a preposition',
  DEF('A <b>preposition</b> (in, on, at, beside, with, to…) shows how things are related. The noun or pronoun after it is the <b>object of the preposition</b>.'),
  P('<b>How to identify it:</b> find the preposition. The noun phrase right after it is its object.'),
  TB(['Sentence','Object of the preposition','Preposition'],[
   [`She sat beside ${U('the teacher')}.`,'the teacher','beside'],
   [`He came with ${U('his sister')}.`,'his sister','with'],
   [`The book is on ${U('the table')}.`,'the table','on']
  ]),
  MIS('Do not call it the direct object. A direct object follows a <b>verb</b>. The object of a preposition follows a <b>preposition</b>.'),
  QZ('b2-10','Quick check','live',[FNQ('b2f10',`What is the function of ${U('the teacher')} in: <em>She sat beside the teacher.</em>?`,['Direct object','Object of a preposition','Subject complement','Indirect object'],1,'The teacher comes right after the preposition beside. It is the object of beside.')])),
 SC('11. Apposition',
  DEF('<b>Apposition</b> is when a noun phrase is placed beside another noun phrase to <b>rename or explain it</b>. Both refer to the same person or thing.'),
  P('<b>How to identify it:</b> two noun phrases side by side (often with commas) that mean the same person or thing, and there is <b>no verb</b> between them.'),
  TB(['Sentence','Apposition','In apposition to'],[
   [`Mr Ade, ${U('our principal')}, spoke.`,'our principal','Mr Ade'],
   [`Lagos, ${U('the commercial capital of Nigeria')}, is crowded.`,'the commercial capital of Nigeria','Lagos'],
   [`My friend ${U('Tunde')} is here.`,'Tunde','my friend']
  ]),
  MIS('Compare <em>Mr Ade, our principal, spoke</em> (apposition) with <em>Mr Ade is our principal</em> (subject complement). The verb <b>is</b> makes the difference.'),
  QZ('b2-11','Quick check','live',[FNQ('b2f11',`What is the function of ${U('our principal')} in: <em>Mr Ade, our principal, spoke.</em>?`,['Subject','Apposition','Subject complement','Object complement'],1,'Our principal renames Mr Ade. There is no verb between them, so it is in apposition.')])),
 SC('12. Adjunct',
  DEF('An <b>adjunct</b> is an <b>optional extra</b> that adds information. If you remove it, the sentence is still complete. Adverbial adjuncts (time, place, manner, reason) are the ones tested most often.'),
  P('<b>How to identify it:</b> remove it. If the sentence still makes complete sense, it is an adjunct.'),
  TB(['Sentence','Adjunct','Why?'],[
   [`Segun ate his lunch ${U('quickly')}.`,'quickly','Segun ate his lunch. is complete without it.'],
   [`The bus left ${U('at noon')}.`,'at noon','The bus left. is complete without it.'],
   [`She sings ${U('in the choir')}.`,'in the choir','She sings. is complete without it.']
  ]),
  TIP('Textbooks use the word <b>adjunct</b> in slightly different ways. Some use it only for optional adverbials. Others also use it for a noun that modifies another noun, as in <em>school bus</em>. If a question uses this word, look at your class notes and your teacher’s examples for the meaning that is taught.'),
  QZ('b2-12','Quick check','live',[FNQ('b2f12','Which part of <em>Segun ate his lunch quickly</em> is an optional <b>adjunct</b>?',['Segun','ate','his lunch','quickly'],3,'Take away quickly and the sentence Segun ate his lunch still makes sense. It is an optional extra.')]))
]);

/* ================= B3: PHRASES AND CLAUSES ================= */
var PC_WORKED=[
 {q:`${U('The tall boy from Kano')} won the race.`,tag:'Noun phrase 1',a:'Structure: noun phrase. Function: subject.',st:['The head word is <b>boy</b>. The other words describe it.','Who won the race? The whole phrase.','Structure: noun phrase. Function: <b>subject</b>.']},
 {q:`She bought ${U('a new red dress')}.`,tag:'Noun phrase 2',a:'Structure: noun phrase. Function: direct object.',st:['The head word is <b>dress</b>.','Bought what? The whole phrase.','Structure: noun phrase. Function: <b>direct object</b>.']},
 {q:`The cat is ${U('under the table')}.`,tag:'Prepositional phrase 1',a:'Structure: prepositional phrase. Function: adverbial of place.',st:['It begins with the preposition <b>under</b>.','Where is the cat? Under the table.','Structure: prepositional phrase. Function: <b>adverbial of place</b>.']},
 {q:`The girl ${U('with the red bag')} is my sister.`,tag:'Prepositional phrase 2',a:'Structure: prepositional phrase. Function: adjectival (modifies “girl”).',st:['It begins with the preposition <b>with</b>.','It does not tell where or when. It tells <b>which girl</b>.','Structure: prepositional phrase. Function: <b>adjectival</b>, because it describes the noun girl.']},
 {q:`She is ${U('very tired')}.`,tag:'Adjectival phrase 1',a:'Structure: adjectival phrase. Function: subject complement.',st:['The head word is the adjective <b>tired</b>, with very in front of it.','It describes the subject, she, after the linking verb is.','Structure: adjectival phrase. Function: <b>subject complement</b>.']},
 {q:`A man ${U('full of kindness')} visited us.`,tag:'Adjectival phrase 2',a:'Structure: adjectival phrase. Function: modifies the noun “man”.',st:['The head word is the adjective <b>full</b>.','It comes after man and describes him.','Structure: adjectival phrase. Function: adjectival (describes man).']},
 {q:`He ran ${U('very quickly')}.`,tag:'Adverbial phrase 1',a:'Structure: adverb phrase. Function: adverbial of manner.',st:['The head word is the adverb <b>quickly</b>, with very in front.','Ran how? Very quickly.','Structure: adverb phrase. Function: <b>adverbial of manner</b>.']},
 {q:`They arrived ${U('quite late')}.`,tag:'Adverbial phrase 2',a:'Structure: adverb phrase. Function: adverbial of time.',st:['The head word is the adverb <b>late</b>, with quite in front.','Arrived when? Quite late.','Structure: adverb phrase. Function: <b>adverbial of time</b>.']},
 {q:`I believe ${U('that she is honest')}.`,tag:'Noun clause 1',a:'Structure: noun clause. Function: direct object of “believe”.',st:['It has its own subject (she) and verb (is).','It answers the question: believe what?','Structure: noun clause. Function: <b>direct object</b> of believe.']},
 {q:`${U('Whoever wins')} gets the prize.`,tag:'Noun clause 2',a:'Structure: noun clause. Function: subject of “gets”.',st:['It has its own subject (whoever) and verb (wins).','Who gets the prize? Whoever wins.','Structure: noun clause. Function: <b>subject</b>.']},
 {q:`The students arrived ${U('after the bell rang')}.`,tag:'Adverbial clause 1',a:'Structure: adverbial clause. Function: adverbial of time.',st:['It has its own subject (the bell) and verb (rang), and begins with <b>after</b>.','Arrived when? After the bell rang.','Structure: adverbial clause. Function: <b>adverbial of time</b>.']},
 {q:`We stayed indoors ${U('because it was raining')}.`,tag:'Adverbial clause 2',a:'Structure: adverbial clause. Function: adverbial of reason.',st:['It has its own subject (it) and verb (was raining).','Stayed indoors why? Because it was raining.','Structure: adverbial clause. Function: <b>adverbial of reason</b>.']},
 {q:`The man ${U('who lives next door')} is a doctor.`,tag:'Relative clause 1',a:'Structure: relative (adjectival) clause. Function: modifies “the man”.',st:['It begins with the relative pronoun <b>who</b> and has its own verb (lives).','It tells <b>which man</b>.','Structure: relative clause. Function: <b>adjectival</b>, modifying the man.']},
 {q:`The book ${U('which I bought yesterday')} is expensive.`,tag:'Relative clause 2',a:'Structure: relative (adjectival) clause. Function: modifies “the book”.',st:['It begins with <b>which</b> and has its own subject (I) and verb (bought).','It tells <b>which book</b>.','Structure: relative clause. Function: <b>adjectival</b>, modifying the book.']},
 {q:`${U('The fact that he passed')} surprised everyone.`,tag:'Noun clause in apposition',a:'The noun clause “that he passed” explains “the fact”. It is in apposition to “the fact”.',st:['Find the verb: <b>surprised</b>. Who or what surprised everyone? The whole phrase <b>the fact that he passed</b>. That is the subject.','Inside it, <b>that he passed</b> is a clause with its own subject (he) and verb (passed).','It tells <b>what the fact is</b>, so it renames or explains the fact. It is a noun clause in apposition to <b>the fact</b>.']}
];
SEC('b3','Part B: Grammatical function','Phrases and clauses','Know what a group of words is built from, and what job it does.',[
 SC('Structure and function',
  P('In WAEC you may be asked about a <b>whole group of words</b>, not just one word. First learn two ideas.'),
  DEF('<b>Phrase:</b> a group of words that works together as one unit but has <b>no subject-verb pair of its own</b>. Example: <em>in the classroom</em>.','Phrase'),
  DEF('<b>Clause:</b> a group of words that has its <b>own subject and verb</b>. Example: <em>after the bell rang</em>.','Clause'),
  P('Every group of words has a <b>structure</b> (what it is made of) and a <b>function</b> (the job it does).'),
  EX('<em>The man <b>who lives next door</b> is a doctor.</em><br><b>Structure:</b> relative clause (it has its own subject who and verb lives).<br><b>Function:</b> adjectival. It tells which man.'),
  TIP('Ask two questions: (1) <b>What is it made of?</b> That gives the structure. (2) <b>What job is it doing here?</b> That gives the function. Answer the one the question asks.')),
 SC('The seven you must know',
  TB(['Structure','What it is','Example','Usual function'],[
   ['<b>Noun phrase</b>','A noun with its describing words','the tall boy from Kano','subject, object, complement'],
   ['<b>Prepositional phrase</b>','A preposition + a noun phrase','under the table','adverbial or adjectival'],
   ['<b>Adjectival phrase</b>','An adjective with other words','very tired','complement or describes a noun'],
   ['<b>Adverbial phrase</b>','An adverb with other words','very quickly','adverbial'],
   ['<b>Noun clause</b>','A clause that works like a noun','that he passed','subject, object, complement'],
   ['<b>Adverbial clause</b>','A clause that works like an adverb','after the bell rang','adverbial of time, reason…'],
   ['<b>Relative / adjectival clause</b>','A clause that describes a noun','who lives next door','modifies a noun']
  ]),
  MIS('A prepositional phrase can have <b>different functions</b>: <em>The cat is [under the table]</em> (adverbial of place), <em>The girl [with the red bag]</em> (adjectival). The structure is the same, the function is not.')),
 SC('Fourteen worked examples, plus one tricky one',
  P('For each: try to name the <b>structure</b> and the <b>function</b> first. Then reveal.'),
  WK('Phrases and clauses',PC_WORKED.slice(0,14))),
 SC('The tricky one: “The fact that he passed surprised everyone”',
  P('This sentence appears in many exam questions. Read it slowly.'),
  WK('Worked example',PC_WORKED.slice(14))),
 SC('Practice: name the underlined expression',
  P('The underlined part is <b>a whole phrase or clause</b>. Decide what job it does.'),
  QZ('b3-p','Phrases and clauses','live',[
   M('b3p1','phrase',`${U('After the match ended')}, the fans went home.`.replace(/^/,'<b>1.</b> ')+'<br>What is the underlined part?',['Adverbial clause of time','Noun clause','Relative clause','Prepositional phrase'],0,'It has its own subject (the match) and verb (ended). It tells when the fans went home.',{1:'A noun clause does the job of a noun. This one tells when.',2:'A relative clause modifies a noun. Nothing is modified here.',3:'A phrase has no subject and verb of its own. This has the match ended.'}),
   M('b3p2','phrase',`<b>2.</b> The woman ${U('who sells akara')} is my aunt.<br>What is the underlined part?`,['Adverbial clause of reason','Noun clause (subject)','Relative (adjectival) clause','Adjectival phrase'],2,'It tells which woman. It starts with the relative pronoun who and has its own verb.',{0:'It does not tell why.',1:'It does not stand as the subject. The subject is The woman.',3:'It has its own verb (sells), so it is a clause, not a phrase.'}),
   M('b3p3','phrase',`<b>3.</b> ${U('That she was late')} annoyed the teacher.<br>What is the underlined part?`,['Adverbial clause of time','Noun clause (subject)','Relative clause','Object of a preposition'],1,'What annoyed the teacher? That she was late. It does the job of a noun and is the subject.',{0:'It does not tell when.',2:'It does not modify a noun.',3:'There is no preposition in front of it.'}),
   M('b3p4','phrase',`<b>4.</b> He lives ${U('in a small village')}.<br>What is the <b>function</b> of the underlined part?`,['Direct object','Adverbial of place','Subject complement','Apposition'],1,'Lives where? In a small village. Its structure is a prepositional phrase, and its function is adverbial of place.',{0:'Lives does not take an object here. It is followed by a place.',2:'Lives is not a linking verb.',3:'It does not rename another noun.'}),
   M('b3p5','phrase',`<b>5.</b> ${U('The new student from Kaduna')} speaks Hausa.<br>What is the underlined part?`,['A noun phrase used as subject','A noun clause','An adverbial clause','A prepositional phrase'],0,'It is a group of words built around the noun student, with no verb of its own. It tells who speaks.',{1:'There is no subject-verb pair inside it.',2:'It does not tell when, why or how.',3:'The whole phrase does not begin with a preposition (only from Kaduna does).'}),
   M('b3p6','phrase',`<b>6.</b> She became ${U('very famous')}.<br>What is the <b>function</b> of the underlined part?`,['Direct object','Adverbial of manner','Subject complement','Object complement'],2,'Became is a linking verb. Very famous describes she, the subject.',{0:'Became does not take an object.',1:'It does not tell how she became.',3:'There is no object before it.'}),
   M('b3p7','phrase',`<b>7.</b> I wonder ${U('whether he will come')}.<br>What is the underlined part?`,['Relative clause','Adverbial clause of time','Noun clause (object)','Prepositional phrase'],2,'Wonder what? Whether he will come. It acts as the object of wonder.',{0:'It does not describe a noun.',1:'It does not tell when.',3:'It has its own subject and verb.'}),
   M('b3p8','phrase',`<b>8.</b> We left ${U('although it was raining')}.<br>What is the underlined part?`,['Noun clause','Relative clause','Adverbial clause','Adjectival phrase'],2,'It has its own subject and verb and adds information about the leaving. It is an adverbial clause (of concession).',{0:'It does not name a thing.',1:'It does not describe a noun.',3:'It has its own verb, so it is a clause.'})

/* ================= B4: EXAM TECHNIQUE ================= */
var TECH_WORKED=[
 {q:`The boy ${U('who won the race')} is my cousin.`,tag:'Example 1',a:'Relative (adjectival) clause, modifying “the boy”.',st:['Read the whole sentence.','The underlined words have a verb (won) and a subject (who).','They tell which boy.','Answer: relative (adjectival) clause.']},
 {q:`She promised ${U('that she would come early')}.`,tag:'Example 2',a:'Noun clause, object of “promised”.',st:['Promised what? That she would come early.','It has its own subject (she) and verb (would come).','Answer: noun clause, direct object of promised.']},
 {q:`We waited ${U('until the rain stopped')}.`,tag:'Example 3',a:'Adverbial clause of time.',st:['Waited when? Until the rain stopped.','It has its own subject (the rain) and verb (stopped).','Answer: adverbial clause of time.']},
 {q:`${U('Our new teacher')} has arrived.`,tag:'Example 4',a:'Noun phrase, subject.',st:['Find the verb: has arrived.','Who has arrived? Our new teacher.','Answer: subject (a noun phrase).']},
 {q:`The principal gave ${U('the prefects')} new badges.`,tag:'Example 5',a:'Indirect object.',st:['Find the verb: gave.','What was given? New badges (direct object).','Who received them? The prefects. They come before the direct object.','Answer: indirect object.']},
 {q:`They made Tunde ${U('the leader')}.`,tag:'Example 6',a:'Object complement.',st:['Verb: made. Object: Tunde.','The leader tells what Tunde was made. It renames the object.','Answer: object complement.']},
 {q:`Ngozi, ${U('a brilliant student')}, won the prize.`,tag:'Example 7',a:'Apposition, to “Ngozi”.',st:['Two noun phrases are side by side with commas: Ngozi and a brilliant student.','They mean the same person. No verb joins them.','Answer: in apposition to Ngozi.']},
 {q:`He spoke ${U('with great confidence')}.`,tag:'Example 8',a:'Adverbial of manner (a prepositional phrase).',st:['Spoke how? With great confidence.','Answer: adverbial of manner.']},
 {q:`The school is ${U('in the heart of the town')}.`,tag:'Example 9',a:'Adverbial of place (a prepositional phrase).',st:['Where is the school? In the heart of the town.','Answer: adverbial of place.']},
 {q:`${U('Because the road was flooded')}, the bus did not move.`,tag:'Example 10',a:'Adverbial clause of reason.',st:['The bus did not move why? Because the road was flooded.','It has its own subject (the road) and verb (was flooded).','Answer: adverbial clause of reason.']}
];

/* ================= C: COMPREHENSION PASSAGE ================= */
var PASSAGE=`<p>When the new term began, the principal of Unity College, Mrs Adeyemi, announced that the school library would be rebuilt. The old building had been neglected for many years, and its roof was leaking badly. Parents, teachers and students were invited to a meeting on Friday afternoon.</p>
<p>At the meeting, Mr Balogun, the senior English teacher, stood up and said, “Our students cannot read well because they have no quiet place to study.” A few parents nodded. Chief Okafor, a retired engineer who lives near the school, promised that he would supervise the work free of charge. Then a student named Hauwa asked whether the new library would have computers. The principal answered that every classroom would receive books first and that computers would follow later.</p>
<p>During the next two weeks, volunteers cleared the compound after school. The old shelves were repaired by the carpentry students, while the girls painted the walls a bright yellow. On the last day, a stranger arrived with a truck of donated books. “I read in this school thirty years ago,” he told the principal, “and I want today’s students to enjoy what I enjoyed.”</p>
<p>The library opened on a sunny morning in November. Hauwa, who had asked the question at the meeting, was chosen to cut the ribbon. She thanked everyone sincerely, and the students applauded loudly. From that day, the reading corner became the most popular place in the school.</p>`;

 M('w1','passive','<b>1.</b> Choose the correct passive form of: <em>The cook has prepared the soup.</em>',['The soup has been prepared by the cook.','The soup was prepared by the cook.','The soup is being prepared by the cook.','The soup had been prepared by the cook.'],0,'Present perfect (has prepared) → has been prepared. B is simple past, C is present continuous and D is past perfect. The tense must be preserved.'),

(function(){
var LS='ss3-eng-recasting-v1', TPIN='2468', MOCKMIN=20;

function save(){try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
function norm(s){return String(s).toLowerCase().replace(/[‘’“”]/g,function(c){return (c==='‘'||c==='’')?"'":'"'}).replace(/[.,;:!?"()]/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim()}
var LET=['A','B','C','D','E'];

/* ---- index all questions ---- */
var QIDX={},QSEC={},TOTAL=0;
function indexQ(q,sid){QIDX[q.id]=q;QSEC[q.id]=sid;TOTAL++}
SECS.forEach(function(s){s.screens.forEach(function(sc){sc.blocks.forEach(function(b){if(b.t==='qz')b.items.forEach(function(q){indexQ(q,s.id)})})})});
MOCK.forEach(function(q){indexQ(q,'d3')});

/* ---- answer checking ---- */
function checkTyped(q,raw){
  if(q.noq&&/["“”]/.test(raw))return {ok:false,msg:'Remove the quotation marks. Reported speech does not use them.'};
  if(q.needq&&!/["“”]/.test(raw))return {ok:false,msg:'Direct speech needs quotation marks around the exact words spoken.'};
  var n=norm(raw);if(!n)return {ok:false,msg:'Type your answer first.',empty:true};
  for(var i=0;i<q.ans.length;i++)if(norm(q.ans[i])===n)return {ok:true};
  if(q.has){var all=true;q.has.forEach(function(g){var f=false;g.forEach(function(w){if(n.indexOf(w)>=0)f=true});if(!f)all=false});if(all)return {ok:true}}
  for(var j=0;j<q.traps.length;j++)if(q.traps[j].re.test(n))return {ok:false,msg:q.traps[j].m};
  return {ok:false,msg:null};
}
function modelText(q){return q.type==='mcq'?LET[q.a]+'. '+q.opts[q.a]:q.ans.map(esc).join('<br><em>or</em> ')}

/* ---- stats ---- */
function resOf(id){return ST.res[id]||null}
function answeredCount(ids){var c=0;ids.forEach(function(i){var r=ST.res[i];if(r&&r.done)c++});return c}
function secQ(sid){var out=[];Object.keys(QSEC).forEach(function(k){if(QSEC[k]===sid)out.push(k)});return out}
function totalProgress(){return Math.round(100*answeredCount(Object.keys(QIDX))/Math.max(1,TOTAL))}
function secObj(id){for(var i=0;i<SECS.length;i++)if(SECS[i].id===id)return SECS[i];return null}
function secIdx(id){for(var i=0;i<SECS.length;i++)if(SECS[i].id===id)return i;return -1}

/* ---- block rendering ---- */
function boxHtml(cls,b){return '<div class="box '+cls+'"><div class="bt">'+esc(b.title)+'</div><div>'+b.h+'</div></div>'}
function tbHtml(b){
  var h='<div class="tw"><table>';
  if(b.head&&b.head.length&&b.head.join('')!=='')h+='<thead><tr>'+b.head.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead>';
  else if(b.head&&b.head.length)h+='<thead><tr>'+b.head.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead>';

  return h;
}

}
function passageHtml(b){

/* ---- live questions ---- */
function liveCard(q){
  var r=resOf(q.id)||{tries:0,wrong:[],done:0};
  var cls=r.done?(r.ok?'ok':'no'):'';
  var h='<div class="qc '+cls+'" data-card="'+q.id+'"><p class="qt">'+q.q+'</p>';
  if(q.type==='mcq'){
    h+=q.opts.map(function(o,i){
      var st='',dis='';
      if(r.done){dis=' disabled';if(i===q.a)st=' good';else if(r.wrong&&r.wrong.indexOf(i)>=0)st=' bad'}

      return '<button class="opt'+st+'" data-act="opt" data-q="'+q.id+'" data-i="'+i+'"'+dis+'><b class="l">'+LET[i]+'.</b> '+esc(o)+'</button>';
    }).join('');
    if(r.wrong&&r.wrong.length&&!r.done){var li=r.wrong[r.wrong.length-1];h+='<div class="fb b"><b>Not quite.</b>'+(q.wr[li]||'Read the question again and try another option.')+' Try again.</div>'}
    if(r.done){
      if(r.ok&&r.tries===0)h+='<div class="fb g"><b>Correct!</b>'+q.why+'</div>';
      else if(r.ok)h+='<div class="fb g"><b>Correct on your second try.</b>'+q.why+'</div>';
      else h+='<div class="fb n"><b>The correct answer is '+LET[q.a]+'.</b>'+q.why+'</div>';
    }
  }else{
    var val=r.val||'';
    if(!r.done||true){
      h+='<div class="row"><input class="tx" type="text" id="in-'+q.id+'" data-q="'+q.id+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="'+esc(q.ph)+'" value="'+esc(val)+'"'+(r.done?' disabled':'')+'>';
      if(!r.done)h+='<button class="btn" data-act="chk" data-q="'+q.id+'">Check</button>';
      h+='</div>';
    }
    if(!r.done){

      if(q.hint)h+=(RT.hint[q.id]?'<div class="fb n"><b>Hint</b>'+esc(q.hint)+'</div>':'<button class="lnk" data-act="hint" data-q="'+q.id+'">Need a hint?</button>');
    }else{

function refreshCard(id){
  var q=QIDX[id],el=$('[data-card="'+id+'"]');if(!el)return;
  var tmp=document.createElement('div');tmp.innerHTML=liveCard(q);el.parentNode.replaceChild(tmp.firstChild,el);

function updateProgress(){

    var ids=b.items.map(function(q){return q.id}),d=answeredCount(ids);

    var p=$('[data-prog="'+id+'"]',z);if(p)p.textContent='Answered '+d+' of '+ids.length+' · Correct first time: '+first;
  });

function findQuiz(id){var f=null;SECS.forEach(function(s){s.screens.forEach(function(sc){sc.blocks.forEach(function(b){if(b.t==='qz'&&b.id===id)f=b})})});return f}

function answerMcq(id,i){
  var q=QIDX[id],r=ST.res[id]||{tries:0,wrong:[],done:0};if(r.done)return;
  if(i===q.a){r.done=1;r.ok=1}
  else{r.tries++;r.wrong.push(i);if(r.tries>=2){r.done=1;r.ok=0}}
  ST.res[id]=r;save();refreshCard(id);
}
function answerTyped(id){
  var q=QIDX[id],r=ST.res[id]||{tries:0,wrong:[],done:0},inp=$('#in-'+id);if(!inp||r.done)return;
  var raw=inp.value,c=checkTyped(q,raw);r.val=raw;
  if(c.empty){r.msg=c.msg;ST.res[id]=r;refreshCard(id);return}
  if(c.ok){r.done=1;r.ok=1;r.msg=null}
  else{r.tries++;r.msg=c.msg||('That is not what I expected. '+(q.hint||'Check each part of the sentence.'));if(r.tries>=2){r.done=1;r.ok=0}}
  ST.res[id]=r;save();refreshCard(id);
}

/* ---- exam sets (WAEC and JAMB style) ---- */

function examHtml(b){

    h+='<div class="score"><div class="big">'+sc+' / '+b.items.length+'</div><div>'+Math.round(100*sc/b.items.length)+'%</div>'+
      Object.keys(by).map(function(t){var p=Math.round(100*by[t].c/by[t].n);return '<div style="margin-top:8px">'+esc(t)+': '+by[t].c+' of '+by[t].n+'<div class="tbar '+(p<50?'low':p<80?'mid':'')+'"><i style="width:'+p+'%"></i></div></div>'}).join('')+

function examOk(q,es){

}
function examCard(q,b,es){
  var sub=es.sub,ok=sub&&examOk(q,es),a=es.a[q.id];

  }

function mockHtml(){

    return '<div class="box def"><div class="bt">Final challenge</div><div>15 questions mixing everything in this note. You have <b>20 minutes</b>. You see your score, a breakdown by topic and an explanation for every answer you missed at the end.</div></div>'+best+

  }
  if(m.done)return mockResult(m);
  var q=MOCK[m.i],a=m.a[m.i];
  var h='<div class="timer">Time left: <span id="tmr">'+fmtT(m.end-Date.now())+'</span> · Question '+(m.i+1)+' of 15</div><div class="qc" data-mc="1"><p class="qt">'+q.q+'</p>';
  h+=q.opts.map(function(o,i){return '<button class="opt'+(a===i?' sel':'')+'" data-act="mopt" data-i="'+i+'"><b class="l">'+LET[i]+'.</b> '+esc(o)+'</button>'}).join('')+'</div>';
  h+='<div class="row">'+(m.i>0?'<button class="btn gh" data-act="mprev">Previous</button>':'')+(m.i<14?'<button class="btn" data-act="mnext">Next</button>':'')+'<button class="btn gh" data-act="mfinish">Finish and see my score</button></div>';
  h+='<div class="prog">Answered '+m.a.filter(function(x){return x!==undefined}).length+' of 15</div>';

}
function fmtT(ms){if(ms<0)ms=0;var s=Math.floor(ms/1000),mm=Math.floor(s/60),ss=s%60;return (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss}
function band(s){return s>=13?['Excellent understanding.','You are ready for the examination questions on this topic.']:s>=10?['Good understanding.','Revise the areas you missed.']:s>=7?['Developing.','More practice is needed.']:['Revisit the lessons.','Go back to the lessons and attempt the exercises again.']}
function mockResult(m){
  var sc=0,by={};
  MOCK.forEach(function(q,i){var ok=m.a[i]===q.a;if(ok)sc++;var t=TOPICS[q.topic]?TOPICS[q.topic].n:q.topic;by[t]=by[t]||{n:0,c:0};by[t].n++;if(ok)by[t].c++});

    Object.keys(by).map(function(t){var p=Math.round(100*by[t].c/by[t].n);return '<div>'+esc(t)+': '+by[t].c+' of '+by[t].n+'<div class="tbar '+(p<50?'low':p<80?'mid':'')+'"><i style="width:'+p+'%"></i></div></div>'}).join('')+
    '<div class="row"><button class="btn" data-act="mstart">Try again</button></div></div><h3>Review: what you missed</h3>';
  var miss=0;
  MOCK.forEach(function(q,i){
    if(m.a[i]===q.a)return;miss++;
    h+='<div class="qc no"><p class="qt">'+(i+1)+'. '+q.q+'</p><div class="fb b"><b>'+(m.a[i]===undefined?'Not answered':'Your answer: '+LET[m.a[i]]+'. '+esc(q.opts[m.a[i]]))+'</b>Correct answer: '+LET[q.a]+'. '+esc(q.opts[q.a])+'<br><br>'+q.why+'</div></div>';
  });
  if(!miss)h+='<div class="fb g"><b>Perfect score!</b>You did not miss a question.</div>';
  return h;
}
var mockTimer=null;
function mockTick(){

/* ---- events ---- */
function onClick(e){
  var t=e.target;while(t&&t!==document&&!(t.getAttribute&&t.getAttribute('data-act')))t=t.parentNode;
  if(!t||t===document)return;
  var act=t.getAttribute('data-act'),q=t.getAttribute('data-q'),i=+t.getAttribute('data-i'),set=t.getAttribute('data-set');
  if(act==='opt')answerMcq(q,i);
  else if(act==='chk')answerTyped(q);
  else if(act==='hint'){RT.hint[q]=1;refreshCard(q)}
  else if(act==='self'){var r=ST.res[q];r.ok=1;r.self=1;save();refreshCard(q)}
  else if(act==='xopt'){examState(set).a[q]=i;save();render(true)}
  else if(act==='xsubmit')examSubmit(set);
  else if(act==='xself'){examState(set).self[q]=1;var b=findQuiz(set);ST.res[q]={done:1,ok:1,tries:0,exam:1,self:1};save();render(true)}
  else if(act==='xreset'){delete ST.exam[set];findQuiz(set).items.forEach(function(x){delete ST.res[x.id]});save();render()}
  else if(act==='mstart'){RT.mock={i:0,a:[],end:Date.now()+MOCKMIN*60000,done:false};if(mockTimer)clearInterval(mockTimer);mockTimer=null;render()}
  else if(act==='mopt'){RT.mock.a[RT.mock.i]=i;render(true)}
  else if(act==='mnext'){RT.mock.i++;render()}
  else if(act==='mprev'){RT.mock.i--;render()}
  else if(act==='mfinish'){mockFinish()}
  else if(act==='go')go(t.getAttribute('data-sec'),+t.getAttribute('data-scr'));
  else if(act==='cont'){var l=ST.last;if(l&&l.sec!=='home'&&secObj(l.sec)&&l.scr<secObj(l.sec).screens.length)go(l.sec,l.scr);else go('start',0)}
  else if(act==='pin'){var v=$('#pin').value;if(v===TPIN){RT.pin=true;RT.pinBad=0}else{RT.pinBad=1}render(true)}
  else if(act==='wipe'){ST.res={};ST.exam={};ST.vis={};ST.mockBest=null;RT.mock=null;RT.hint={};save();render()}
  else if(act==='closed')closeDrawer();
}
function onKey(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains('tx')&&e.key==='Enter'){
    var q=t.getAttribute('data-q');if(q&&t.id==='in-'+q)answerTyped(q);
    if(t.id==='pin')$('[data-act="pin"]').click();
  }
}
