function checkTyped(q,raw){
  if(q.noq&&/["“”]/.test(raw))return {ok:false,msg:'Remove the quotation marks. Reported speech does not use them.'};
  if(q.needq&&!/["“”]/.test(raw))return {ok:false,msg:'Direct speech needs quotation marks around the exact words spoken.'};
  var n=norm(raw);if(!n)return {ok:false,msg:'Type your answer first.',empty:true};
  for(var i=0;i<q.ans.length;i++)if(norm(q.ans[i])===n)return {ok:true};
  if(q.has){var all=true;q.has.forEach(function(g){var f=false;g.forEach(function(w){if(n.indexOf(w)>=0)f=true});if(!f)all=false});if(all)return {ok:true}}
  for(var j=0;j<q.traps.length;j++)if(q.traps[j].re.test(n))return {ok:false,msg:q.traps[j].m};
  return {ok:false,msg:null};
}

/* ---------- audio: sfx + chiptune music ---------- */
let AC=null,MG=null,NB=null;
function actx(){
  if(AC)return AC;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=1;MG.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}
  return AC;
}
function tone(f,t,d,type='square',v=.08,dest){
  const c=actx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(dest||MG);o.start(t);o.stop(t+d+.02);
}
function noise(t,d,v,hp){
  const c=actx();if(!c)return;const s=c.createBufferSource();s.buffer=NB;const g=c.createGain(),f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d);
}
const now=()=>AC?AC.currentTime:0;
const sfx={
  ok(){if(!S.sfx||!actx())return;const t=now();tone(659,t,.1);tone(880,t+.09,.1);tone(1175,t+.18,.2)},
  no(){if(!S.sfx||!actx())return;const t=now();tone(220,t,.2,'sawtooth',.09);tone(150,t+.12,.3,'sawtooth',.09)},
  tap(){if(!S.sfx||!actx())return;tone(520,now(),.06,'square',.05)},
  flip(){if(!S.sfx||!actx())return;const t=now();tone(330,t,.08);tone(660,t+.07,.12)},
  hit(){buzz(60);if(!S.sfx||!actx())return;const t=now();noise(t,.18,.25,300);tone(110,t,.2,'sawtooth',.12)},
  win(){if(!S.sfx||!actx())return;const t=now();[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.1,.3,'square',.08))},
  lose(){if(!S.sfx||!actx())return;const t=now();[392,330,262,196].forEach((f,i)=>tone(f,t+i*.18,.35,'sawtooth',.08))},
  whoosh(){if(!S.sfx||!actx())return;noise(now(),.35,.12,1500)},
  tick(){if(!S.sfx||!actx())return;tone(170,now(),.1,'square',.08)},
  drone(){if(!S.sfx||!actx())return;const t=now();tone(82,t,1.6,'sawtooth',.06);tone(87,t,1.6,'sawtooth',.04)},
  boom(){buzz(120);if(!S.sfx||!actx())return;const t=now();noise(t,.45,.3,150);tone(60,t,.6,'sawtooth',.18)},
  dark(){if(!S.sfx||!actx())return;const t=now();[380,300,230,170,120].forEach((f,i)=>tone(f,t+i*.09,.25,'triangle',.08))},
  up(){if(!S.sfx||!actx())return;const t=now();[392,523,659,784,1047,784,1047].forEach((f,i)=>tone(f,t+i*.08,.2,'triangle',.1))}
};
/* music: 16-step bar, Am F C G. "menu" is relaxed, "battle" adds drums and runs faster. */
const MU={mode:'menu',step:0,next:0,timer:null,on:false};
const ROOTS=[110,87.31,130.81,98],TRI=[[1,1.2,1.5],[1,1.25,1.5],[1,1.25,1.5],[1,1.25,1.5]];
const MEL=[0,4,2,4, 5,4,2,0, 4,5,7,5, 4,2,0,2];
const PENT=[440,523.25,587.33,659.25,783.99,880,1046.5,1174.66];
function schedule(){
  const c=actx();if(!c)return;const bpm=MU.mode==='battle'?142:112,sd=60/bpm/4;
  while(MU.next<c.currentTime+.18){
    const s=MU.step%64,bar=(s>>4)&3,p=s&15,t=MU.next,r=ROOTS[bar],v=MU.mode==='battle'?1:.7;
    if(p%2===0)tone(r*2*(TRI[bar][(p/2|0)%3]),t,sd*1.6,'square',.025*v);
    if(p%4===0||(MU.mode==='battle'&&p%4===2))tone(r,t,sd*1.8,'triangle',.11*v);
    if(p%2===0&&(bar%2===1||MU.mode==='battle'))tone(PENT[MEL[p]%8],t,sd*1.4,'square',.03*v);
    if(MU.mode==='battle'){if(p%4===0){tone(120,t,.1,'sine',.18);noise(t,.04,.06,5000)}if(p===4||p===12)noise(t,.12,.14,1200);if(p%2===1)noise(t,.03,.04,7000)}
    else if(p%4===0)noise(t,.03,.03,6000);
    MU.next+=sd;MU.step++;
  }
}
function musicSet(mode){
  MU.mode=mode;if(!S.music||MU.on)return;const c=actx();if(!c)return;
  if(c.state==='suspended')c.resume();MU.on=true;MU.next=c.currentTime+.05;MU.timer=setInterval(schedule,40);
}
function musicStop(){clearInterval(MU.timer);MU.on=false}
function musicSync(){if(S.music)musicSet(MU.mode);else musicStop()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicStop();else musicSync()});

function chipsRender(box,toks,animate){
  var old={},first={},seen={};
  [].forEach.call(box.children,function(c){var k=c.getAttribute('data-k');old[k]=c;first[k]=c.getBoundingClientRect()});
  var br=box.getBoundingClientRect();
  toks.forEach(function(t){
    var c=old[t.k],fresh=false;if(!c){c=document.createElement('span');c.setAttribute('data-k',t.k);fresh=true}
    var changed=!fresh&&c.textContent!==t.t;
    c.textContent=t.t;c.className='chip c-'+(t.c||'x')+(fresh?' pop':'')+(changed?' chg':'');
    if(t.lab)c.setAttribute('data-lab',t.lab);else c.removeAttribute('data-lab');
    box.appendChild(c);seen[t.k]=1;
  });
  Object.keys(old).forEach(function(k){
    if(seen[k])return;var c=old[k];
    if(animate&&!isLite()&&!RM){c.style.position='absolute';c.style.left=(first[k].left-br.left)+'px';c.style.top=(first[k].top-br.top)+'px';c.className+=' gone';box.appendChild(c);setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c)},450)}
    else if(c.parentNode)c.parentNode.removeChild(c);
  });
  if(!animate||isLite()||RM)return;
  [].forEach.call(box.children,function(c){
    var k=c.getAttribute('data-k');if(!first[k]||!seen[k])return;
    var l=c.getBoundingClientRect(),dx=first[k].left-l.left,dy=first[k].top-l.top;
    if(Math.abs(dx)>1||Math.abs(dy)>1){c.style.transition='none';c.style.transform='translate('+dx+'px,'+dy+'px)';
      (function(c){requestAnimationFrame(function(){requestAnimationFrame(function(){c.style.transition='transform .65s cubic-bezier(.2,.9,.3,1)';c.style.transform=''})})})(c)}
  });
}
function animInit(el){
  var id=el.getAttribute('data-anim'),D=ANIMS[id],k=0,n=D.steps.length;
  el.innerHTML='<div class="at">'+esc(D.title)+'</div><div class="chips" role="img" aria-label="Animated sentence"></div><div class="acap" aria-live="polite"></div><div class="aprog"></div><div class="row"><button class="btn gh sm" data-x="p">Back</button><button class="btn" data-x="n">Next step</button><button class="btn gh sm" data-x="r">Replay</button></div>';

  function show(i,anim){

    bp.disabled=i===0;bn.disabled=i===n-1;

  bn.onclick=function(){sfx.flip();if(k<n-1)show(k+1,true)};
  br.onclick=function(){sfx.tap();box.innerHTML='';show(0,false)};

/* ---- class quiz battle (needs no server) ---- */
function seedInt(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function sshuffle(a,rng){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function codeSig(name,score){var h=0,s=name+'|'+score+'|SS3';for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%46656;var o=h.toString(36);while(o.length<3)o='0'+o;return o}

/* ---- levels: you must clear one before the next opens ---- */
function secFin(id){var s=secObj(id);return s.screens.every(function(_,i){return ST.fin[id+':'+i]})}
function levelCleared(i){
  var L=LEVELS[i];

  if(L.mock)return !!ST.mockDone;

}
function levelUnlocked(i){return i===0||levelCleared(i-1)}
function levelOfSec(id){for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].secs.indexOf(id)>=0)return i;return -1}
function bonusOf(id){for(var i=0;i<BONUS.length;i++)if(BONUS[i].id===id)return BONUS[i];return null}
function secAllowed(id){

function levelBar(sec,scr){
  var s=secObj(sec),i=levelOfSec(sec),done=0;

function levelResume(i){

  for(var a=0;a<L.secs.length;a++){var s=secObj(L.secs[a]);for(var k=0;k<s.screens.length;k++){if(!ST.fin[s.id+':'+k]){return [s.id,k]}}}

function labWin(el,D,mist,fb,extra){

function labBad(fb,msg){sfx.no();fb.innerHTML='<div class="fb b"><b>Not quite.</b>'+msg+'</div>'}
function labOk(fb,msg){sfx.ok();fb.innerHTML='<div class="fb g"><b>Yes!</b>'+msg+'</div>'}
var ROLES={s:'subject',v:'verb',o:'object',n:'',k:''};

/* tap: find the parts of a sentence */
function tapLab(el,D){
  var sh=labShell(el,D,'DETECTIVE'),ti=0,mist=0,found={};
  function draw(){
    var t=D.tasks[ti];
    var h='<div class="toks">'+D.toks.map(function(w,i){var f=found[i];return '<button class="tk'+(f?' c-'+f.role:'')+'" data-i="'+i+'"'+(f?' disabled':'')+(f&&f.lab?' data-lab="'+esc(f.lab)+'"':'')+'>'+esc(w)+'</button>'}).join('')+'</div>';
    sh.body.innerHTML=h+(t?'<div class="ask">'+t.ask+'</div>':'');
    $$('.tk',sh.body).forEach(function(b){b.onclick=function(){tap(+b.getAttribute('data-i'))}});
  }
  function tap(i){
    var t=D.tasks[ti];if(!t)return;
    if(t.a.indexOf(i)>=0){found[i]={role:t.role||'n',lab:t.lab||''};ti++;gameFirst();
      if(ti>=D.tasks.length){draw();labWin(el,D,mist,sh.fb,'<div class="fb g"><b>Yes!</b>'+t.say+'</div>');return}
      labOk(sh.fb,t.say);draw();
    }else{mist++;labBad(sh.fb,t.hint||'That is not it. Look again.');var b=$('.tk[data-i="'+i+'"]',sh.body);if(b){b.classList.add('shake');setTimeout(function(){b.classList.remove('shake')},400)}}
  }
  draw();
}

/* build: tap tiles to make the sentence */
function buildLab(el,D){
  var sh=labShell(el,D,'BUILD'),mist=0,ans=[],order=shuf(D.tiles.map(function(_,i){return i})),won=false;
  var tg=D.targets.map(function(s){return norm(s)});
  function words(){return ans.map(function(i){return D.tiles[i]}).join(' ')}
  function draw(){
    sh.body.innerHTML='<div class="bline" id="bl">'+(ans.length?ans.map(function(i,k){return '<button class="ltile on" data-k="'+k+'">'+esc(D.tiles[i])+'</button>'}).join(''):'<span class="hintline">Tap the tiles in the right order</span>')+'</div>'+
      '<div class="bpool">'+order.map(function(i){return ans.indexOf(i)>=0?'':'<button class="ltile" data-i="'+i+'">'+esc(D.tiles[i])+'</button>'}).join('')+'</div>'+
      '<div class="row"><button class="btn" id="bck"'+(won?' disabled':'')+'>Check</button><button class="btn gh sm" id="bcl">Clear</button><button class="btn gh sm" id="bht">Hint</button></div>';
    $$('.bpool .ltile',sh.body).forEach(function(b){b.onclick=function(){if(won)return;sfx.tap();ans.push(+b.getAttribute('data-i'));draw()}});
    $$('.bline .ltile',sh.body).forEach(function(b){b.onclick=function(){if(won)return;sfx.tap();ans.splice(+b.getAttribute('data-k'),1);draw()}});
    $('#bcl',sh.body).onclick=function(){ans=[];sh.fb.innerHTML='';draw()};
    $('#bht',sh.body).onclick=function(){if(won)return;mist++;var t=D.targets[0].split(' ');
      // next correct tile: find the tile whose text starts the missing part
      var cur=norm(words()),want=norm(D.targets[0]);var next='';
      if(want.indexOf(cur)===0&&cur!==want){next=want.slice(cur.length).trim();}
      sh.fb.innerHTML='<div class="fb n"><b>Hint</b>'+(D.hint||('Think about what comes first. '+(next?'The next piece starts with: “'+esc(next.split(' ')[0])+'”.':'Clear and start again.')))+'</div>'};
    $('#bck',sh.body).onclick=function(){
      if(!ans.length){labBad(sh.fb,'Tap some tiles first.');return}
      var n=norm(words());
      if(tg.indexOf(n)>=0){won=true;$$('.bline .ltile',sh.body).forEach(function(b){b.classList.add('good')});labWin(el,D,mist,sh.fb,'<div class="fb g"><b>Built it!</b>'+esc(D.targets[0])+'</div>');return}
      mist++;var msg=null;(D.traps||[]).forEach(function(t){if(!msg&&t.re.test(n))msg=t.m});
      var good=0,tw=tg[0].split(' '),aw=n.split(' ');for(var i=0;i<aw.length;i++)if(aw[i]===tw[i])good++;
      labBad(sh.fb,(msg||'Some tiles are in the wrong place.')+' ('+good+' of '+tw.length+' words are in the right spot.)');
    };
  }
  draw();
}

/* cycle: tap a word to change it until the sentence is right */
function cycleLab(el,D){
  var sh=labShell(el,D,'REPAIR'),mist=0,won=false,state=[];
  var slots=[];D.t.forEach(function(x,i){if(typeof x!=='string')slots.push(i)});
  D.t.forEach(function(x,i){if(typeof x!=='string'){var s=0;if(s===x.a)s=1;state[i]=s}});
  function draw(res){
    sh.body.innerHTML='<div class="cyc">'+D.t.map(function(x,i){
      if(typeof x==='string')return '<span class="cw">'+esc(x)+'</span>';
      var cls='slot'+(res&&res[i]===true?' ok':res&&res[i]===false?' bad':'');
      return '<button class="'+cls+'" data-i="'+i+'"'+(won?' disabled':'')+'>'+esc(x.o[state[i]])+' ↻</button>'}).join(' ')+'</div><div class="row"><button class="btn" id="cck"'+(won?' disabled':'')+'>Check</button></div>';
    $$('.slot',sh.body).forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-i');state[i]=(state[i]+1)%D.t[i].o.length;sfx.tap();draw()}});
    $('#cck',sh.body).onclick=function(){
      var res={},ok=0;slots.forEach(function(i){var r=state[i]===D.t[i].a;res[i]=r;if(r)ok++});
      if(ok===slots.length){won=true;draw(res);
        var why='';slots.forEach(function(i){if(D.t[i].why)why+='<li>'+D.t[i].why+'</li>'});
        labWin(el,D,mist,sh.fb,'<div class="fb g"><b>Fixed!</b>'+(why?'<ul class="why">'+why+'</ul>':'')+'</div>');return}
      mist++;draw(res);labBad(sh.fb,ok+' of '+slots.length+' changed words are right. The red ones are still wrong. Tap them to change.');
    };
  }
  draw();
}

/* sort: put each item in the right bucket */
function sortLab(el,D){
  var sh=labShell(el,D,'SORT'),mist=0,done={},n=D.items.length,cnt=0;
  function draw(){
    sh.body.innerHTML=D.items.map(function(it,i){
      var d=done[i];
      return '<div class="srow'+(d?' ok':'')+'" data-i="'+i+'"><div class="st">'+it.t+'</div><div class="sb2">'+D.buckets.map(function(b,k){return '<button class="bk'+(d&&it.b===k?' on':'')+'" data-i="'+i+'" data-k="'+k+'"'+(d?' disabled':'')+'>'+esc(b)+'</button>'}).join('')+'</div>'+(d&&it.why?'<div class="swhy">'+it.why+'</div>':'')+'</div>'}).join('');
    $$('.bk',sh.body).forEach(function(b){b.onclick=function(){
      var i=+b.getAttribute('data-i'),k=+b.getAttribute('data-k'),it=D.items[i];
      if(it.b===k){done[i]=1;cnt++;sfx.ok();draw();if(cnt>=n){labWin(el,D,mist,sh.fb)}}
      else{mist++;sfx.no();b.classList.add('shake');labBad(sh.fb,it.hint||D.hint||'Think again. Try the other bucket.');setTimeout(function(){b.classList.remove('shake')},400)}
    }});
  }
  draw();
}

/* match: tap a word on the left, then its partner on the right */
function matchLab(el,D){
  var sh=labShell(el,D,'MATCH'),mist=0,sel=-1,done={},order=shuf(D.pairs.map(function(_,i){return i})),cnt=0;
  function draw(){
    sh.body.innerHTML='<div class="mt"><div class="mc">'+D.pairs.map(function(p,i){return '<button class="mb'+(done[i]?' ok':'')+(sel===i?' sel':'')+'" data-l="'+i+'"'+(done[i]?' disabled':'')+'>'+esc(p.l)+'</button>'}).join('')+'</div><div class="mc">'+order.map(function(i){var p=D.pairs[i];return '<button class="mb'+(done[i]?' ok':'')+'" data-r="'+i+'"'+(done[i]?' disabled':'')+'>'+esc(p.r)+'</button>'}).join('')+'</div></div>';
    $$('[data-l]',sh.body).forEach(function(b){b.onclick=function(){sel=+b.getAttribute('data-l');sfx.tap();draw()}});
    $$('[data-r]',sh.body).forEach(function(b){b.onclick=function(){
      if(sel<0){labBad(sh.fb,'Tap a word on the left first.');return}
      var r=+b.getAttribute('data-r');
      if(r===sel){done[r]=1;cnt++;sel=-1;sfx.ok();draw();if(cnt>=D.pairs.length)labWin(el,D,mist,sh.fb)}
      else{mist++;sfx.no();b.classList.add('shake');labBad(sh.fb,'Those two do not go together. Try again.');setTimeout(function(){b.classList.remove('shake')},400)}
    }});
  }
  draw();
}

/* explore: press every button and watch what happens */
function exploreLab(el,D){
  var sh=labShell(el,D,'EXPERIMENT'),seen={},cnt=0,cur=-1;
  function draw(){
    sh.body.innerHTML='<div class="ex">'+D.items.map(function(it,i){return '<button class="eb'+(seen[i]?' seen':'')+(cur===i?' cur':'')+'" data-i="'+i+'">'+esc(it.b)+'</button>'}).join('')+'</div><div class="eout">'+(cur>=0?D.items[cur].h:'<span class="hintline">Press a button to see what happens.</span>')+'</div><div class="prog">Tried '+cnt+' of '+D.items.length+'</div>';
    $$('.eb',sh.body).forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-i');cur=i;if(!seen[i]){seen[i]=1;cnt++}sfx.flip();draw();if(cnt>=D.items.length&&!ST.lab[D.id])labWin(el,D,0,sh.fb);else if(cnt>=D.items.length)sh.fb.innerHTML='<div class="disc"><b>YOU DISCOVERED</b>'+D.disc+'</div>'}});
  }
  draw();
  if(ST.lab[D.id]){sh.fb.innerHTML='<div class="disc"><b>YOU DISCOVERED</b>'+D.disc+'</div>'}
}

/* ---- live questions ---- */
function liveCard(q){
  var r=resOf(q.id)||{tries:0,wrong:[],done:0};
  var cls=r.done?(r.ok?'ok':'no'):'';
  var h='<div class="qc '+cls+'" data-card="'+q.id+'"><p class="qt">'+q.q+'</p>';
  if(q.type==='mcq'){
    h+=q.opts.map(function(o,i){
      var st='',dis='';
      if(r.done){dis=' disabled';if(i===q.a)st=' good';else if(r.wrong&&r.wrong.indexOf(i)>=0)st=' bad'}
      else if(r.wrong&&r.wrong.indexOf(i)>=0){st=' bad';dis=' disabled'}
      return '<button class="opt'+st+'" data-act="opt" data-q="'+q.id+'" data-i="'+i+'"'+dis+'><b class="l">'+LET[i]+'.</b> '+esc(o)+'</button>';
    }).join('');
    if(r.wrong&&r.wrong.length&&!r.done){var li=r.wrong[r.wrong.length-1];h+='<div class="fb b"><b>Not quite.</b>'+(q.wr[li]||'Read the question again and try another option.')+' Try again.</div>'}
    if(r.done){
      if(r.ok&&r.tries===0)h+='<div class="fb g"><b>Correct!</b>'+q.why+'</div>';
      else if(r.ok)h+='<div class="fb g"><b>Correct on your second try.</b>'+q.why+'</div>';
      else h+='<div class="fb n"><b>The correct answer is '+LET[q.a]+'.</b>'+q.why+'</div>';
    }
  }else{
    var val=r.val||'';
    if(!r.done||true){
      h+='<div class="row"><input class="tx" type="text" id="in-'+q.id+'" data-q="'+q.id+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="'+esc(q.ph)+'" value="'+esc(val)+'"'+(r.done?' disabled':'')+'>';
      if(!r.done)h+='<button class="btn" data-act="chk" data-q="'+q.id+'">Check</button>';
      h+='</div>';
    }
    if(!r.done){
      if(r.msg)h+='<div class="fb b"><b>Not quite.</b>'+r.msg+(r.tries<2?' Try again.':'')+'</div>';
      if(q.hint)h+=(RT.hint[q.id]?'<div class="fb n"><b>Hint</b>'+esc(q.hint)+'</div>':'<button class="lnk" data-act="hint" data-q="'+q.id+'">Need a hint?</button>');
    }else{
      if(r.ok)h+='<div class="fb g"><b>Correct!</b>'+q.why+'</div>';
      else h+='<div class="fb n"><b>Model answer</b>'+modelText(q)+'<br><br>'+q.why+'</div><button class="btn gh sm" data-act="self" data-q="'+q.id+'">My answer means the same</button>';
    }
  }
  return h+'</div>';
}

  app.innerHTML=h;
  gameAfter(app);
  ST.last=cur;save();
  if(!keepScroll)window.scrollTo(0,0);
  var bar=$('#gbar');if(bar)bar.style.width=totalProgress()+'%';
  var sub=$('#sub');if(sub)sub.textContent=cur.sec==='home'?'Choose your level':levelLabel(cur.sec);
  buildDrawer();hud();
  if(cur.sec!=='home'){penWalk();revUpdate()}
  if(RT.mock&&!RT.mock.done&&!mockTimer)mockTimer=setInterval(mockTick,1000);
}
function go(sec,scr){
  if(sec!=='home'&&!secAllowed(sec)){sfx.no();penToast('no','Locked! Clear the earlier level first.');return}
  var prevSec=RT.cur.sec;RT.cur={sec:sec,scr:scr||0};closeDrawer();render();if(sec!=='home'&&sec!==prevSec)gameIntro(sec)
}
function next(){
  var cur=RT.cur;if(cur.sec==='home')return;
  var nxb=document.getElementById('nx');if(nxb&&nxb.disabled)return;
  var key=curKey(),n=RT.units.length,i=(RT.rev[key]||1)-1;
  if(i<n-1){gotoCard(i+1,'fwd');return}
  var s=secObj(cur.sec);
  if(cur.scr<s.screens.length-1){go(cur.sec,cur.scr+1);return}
  var ns=nextSecInLevel(cur.sec);
  if(ns){go(ns,0);return}
  levelFinish(cur.sec);
}
function prev(){
  var cur=RT.cur;if(cur.sec==='home')return;
  var key=curKey(),i=(RT.rev[key]||1)-1;
  if(i>0){gotoCard(i-1,'back');return}
  if(cur.scr>0){RT.rev[cur.sec+':'+(cur.scr-1)]=9999;go(cur.sec,cur.scr-1);return}
  go('home',0);
}
function buildDrawer(){var d=$('#drawer');d.innerHTML='<div class="row"><b style="flex:1">Settings</b><button class="ib" data-act="closed" aria-label="Close">✕</button></div>'+gameDrawer()}
function openDrawer(){$('#drawer').classList.add('on');$('#shade').classList.add('on')}
function closeDrawer(){$('#drawer').classList.remove('on');$('#shade').classList.remove('on')}

/* ---- events ---- */
function onClick(e){
  gameFirst();
  var t=e.target;while(t&&t!==document&&!(t.getAttribute&&t.getAttribute('data-act')))t=t.parentNode;
  if(!t||t===document)return;
  var act=t.getAttribute('data-act'),q=t.getAttribute('data-q'),i=+t.getAttribute('data-i'),set=t.getAttribute('data-set');
  if(act==='opt')answerMcq(q,i);
  else if(act==='chk')answerTyped(q);
  else if(act==='hint'){RT.hint[q]=1;refreshCard(q)}
  else if(act==='self'){var r=ST.res[q];r.ok=1;r.self=1;save();refreshCard(q)}
  else if(act==='xopt'){examState(set).a[q]=i;save();render(true)}
  else if(act==='xsubmit')examSubmit(set);
  else if(act==='xself'){examState(set).self[q]=1;var b=findQuiz(set);ST.res[q]={done:1,ok:1,tries:0,exam:1,self:1};save();render(true)}
  else if(act==='xreset'){delete ST.exam[set];findQuiz(set).items.forEach(function(x){delete ST.res[x.id]});save();render()}
  else if(act==='mstart'){RT.mock={i:0,a:[],end:Date.now()+MOCKMIN*60000,done:false};if(mockTimer)clearInterval(mockTimer);mockTimer=null;render()}
  else if(act==='mopt'){RT.mock.a[RT.mock.i]=i;render(true)}
  else if(act==='mnext'){RT.mock.i++;render()}
  else if(act==='mprev'){RT.mock.i--;render()}
  else if(act==='mfinish'){mockFinish()}
  else if(act==='go')go(t.getAttribute('data-sec'),+t.getAttribute('data-scr'));
  else if(act==='cont'){var l=ST.last;if(l&&l.sec!=='home'&&secObj(l.sec)&&l.scr<secObj(l.sec).screens.length)go(l.sec,l.scr);else go('start',0)}
  else if(act==='pin'){var v=$('#pin').value;if(v===TPIN){RT.pin=true;RT.pinBad=0}else{RT.pinBad=1}render(true)}
  else if(act==='wipe'){ST.res={};ST.exam={};ST.vis={};ST.mockBest=null;RT.mock=null;RT.hint={};save();render()}
  else if(act==='closed')closeDrawer();
  else if(act==='set')gameSet(t.getAttribute('data-k'));
  else if(act==='lvl')openLevel(+t.getAttribute('data-i'));
  else if(act==='bon')openBonus(t.getAttribute('data-sec'));
  else if(act==='tpin')gameTeacherPin();
}
function onKey(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains('tx')&&e.key==='Enter'){
    var q=t.getAttribute('data-q');if(q&&t.id==='in-'+q)answerTyped(q);
    if(t.id==='pin')$('[data-act="pin"]').click();
  }
}
function onInput(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute('data-act')==='xtype'){var es=examState(t.getAttribute('data-set'));es.a[t.getAttribute('data-q')]=t.value;save();var cs=$('[data-set="'+t.getAttribute('data-set')+'"]');var q=$('[data-quiz="'+t.getAttribute('data-set')+'"] .prog');if(q){var b=findQuiz(t.getAttribute('data-set')),n=0;b.items.forEach(function(x){if(es.a[x.id]!==undefined&&es.a[x.id]!=='')n++});q.textContent='Answered '+n+' of '+b.items.length}}
}
document.addEventListener('click',onClick);
document.addEventListener('keydown',onKey);
document.addEventListener('input',onInput);
$('#menu').onclick=function(){go('home',0)};$('#cog').onclick=openDrawer;$('#shade').onclick=closeDrawer;
$('#pv').onclick=prev;$('#nx').onclick=next;
$('#brand').onclick=function(){go('home',0)};
load();
gameBoot();
RT.cur={sec:'home',scr:0};
render();
window.__ENG={revUpdate:function(){revUpdate()},showAll:function(){[].forEach.call(document.querySelectorAll('[data-u]'),function(x){x.hidden=false})},SECS:SECS,QIDX:QIDX,checkTyped:checkTyped,go:go,ST:ST,RT:RT,MOCK:MOCK,WAEC:WAEC,JAMB:JAMB,norm:norm,TOTAL:function(){return TOTAL}};
})();

</script></body></html>
