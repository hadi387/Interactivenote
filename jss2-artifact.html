<title>Network Squad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Concept: arcade HUD. Dark neon world, chamfered panels and skewed buttons, binary rain behind, music and motion on every action. Deliberately one dark look. */
:root{
  --void:#0B0720;--panel:#16103F;--panel2:#221858;--line:#3D2F98;--text:#F4F0FF;--muted:#B5AAEA;
  --cyan:#19D3FF;--mag:#FF2E88;--gold:#FFC700;--lime:#3CFF8F;--red:#FF4757;--violet:#8A5CFF;--ink:#1B1200;
  --f-display:'Russo One','Arial Black',Impact,sans-serif;--f-body:'Rajdhani','Segoe UI',system-ui,sans-serif;
  --cut:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  --cut-s:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--void)}
body{margin:0;background:#150E3D;background:radial-gradient(120% 70% at 50% -10%,color-mix(in srgb,var(--world,#2A1B7A) 50%,#0B0720) 0%,var(--void) 60%) fixed;color:var(--text);font:600 18px/1.4 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:0;padding-bottom:90px;overflow-x:hidden}
body::before{content:"";position:fixed;top:0;right:0;left:0;height:env(safe-area-inset-top,0px);z-index:60;background:var(--void)}
#rain{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
.wrap{max-width:900px;margin:0 auto;position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
a{color:inherit}
.skew{display:inline-block;transform:skewX(-8deg)}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--cyan)}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* buttons: skewed slabs */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--gold);color:var(--ink);font-family:var(--f-display);text-transform:uppercase;font-size:18px;letter-spacing:.04em;padding:14px 28px;min-height:54px;text-decoration:none;transform:skewX(-10deg);box-shadow:5px 5px 0 #8E6A00;transition:transform .08s,box-shadow .08s}
.btn>*{transform:skewX(10deg)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:skewX(-10deg) translate(4px,4px);box-shadow:1px 1px 0 #8E6A00}
.btn.cy{background:var(--cyan);box-shadow:5px 5px 0 #0A6F8C}
.btn.mg{background:var(--mag);color:#fff;box-shadow:5px 5px 0 #8F1450}
.btn.gh{background:transparent;color:var(--text);box-shadow:none;border:2px solid var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* chamfered panels */
.panel{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));clip-path:var(--cut);padding:18px 20px 18px 24px;min-width:0}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--acc,var(--cyan))}
.panel.sm{clip-path:var(--cut-s);padding:12px 16px 12px 20px}

/* HUD */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(11,7,32,.96),rgba(11,7,32,.85));border-bottom:3px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-display);text-transform:uppercase;font-size:20px;letter-spacing:.03em;background:none;border:0;padding:0;color:var(--text);flex:none}
.logo b{color:var(--gold);font-weight:400}
.hud{display:flex;align-items:center;gap:10px;flex:1;min-width:0;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:8px;min-width:0}
.av{flex:none;width:38px;height:38px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-family:var(--f-display);color:#fff;font-size:17px}
.xpbox{display:grid;gap:3px;min-width:0;flex:0 1 170px}
.xpbox .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.xpbox .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xpbar{height:12px;background:#0B0720;transform:skewX(-20deg);border:2px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9D00);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.nv{display:flex;gap:6px}
.nv button{background:var(--panel);border:2px solid var(--line);transform:skewX(-10deg);padding:6px 10px;display:flex;align-items:center;gap:6px;font-family:var(--f-display);text-transform:uppercase;font-size:13px}
.nv button>*{transform:skewX(10deg)}
.nv button[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#001A22}
.nv button.off{opacity:.5}

/* reveal motion */
@keyframes up{from{opacity:0;transform:translateY(28px) skewY(2deg)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes slam{0%{opacity:0;transform:scale(3.2) skewX(-8deg);filter:blur(10px)}60%{opacity:1;transform:scale(.94) skewX(-8deg);filter:none}100%{opacity:1;transform:scale(1) skewX(-8deg)}}
@keyframes shake{10%,50%,90%{transform:translateX(-8px)}30%,70%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,199,0,.0),0 0 28px 4px rgba(255,199,0,.6)}}
@keyframes floatUp{to{opacity:0;transform:translateY(-70px) scale(1.4)}}
@keyframes sweep{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(220%) skewX(-20deg)}}
@keyframes dash{to{background-position:0 -40px}}
@keyframes flash{from{opacity:.75}to{opacity:0}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px) rotate(-4deg) scale(.9)}70%{transform:translateY(6px) rotate(1deg)}100%{opacity:1;transform:none}}
.rv{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.pre{opacity:0;transform:translateY(28px)}
.shake{animation:shake .4s}
body.shk .wrap{animation:shake .35s}

/* welcome */
.start{min-height:calc(100vh - 90px);display:grid;align-content:center;gap:22px;padding-top:30px;padding-bottom:30px;justify-items:start}
.start h1{font-size:clamp(54px,13vw,120px);line-height:.95;color:#fff;text-shadow:5px 5px 0 var(--mag),10px 10px 0 var(--violet)}
.start h1 span{display:inline-block;opacity:0;animation:slam .55s cubic-bezier(.2,.8,.2,1) forwards}
.start .tag{max-width:46ch;font-size:21px;color:var(--muted)}
.press{font-family:var(--f-display);font-size:22px;letter-spacing:.2em;color:var(--gold);animation:pulse 1.1s infinite;text-transform:uppercase}
.field{display:grid;gap:8px;width:100%;max-width:430px}
.field label{font-family:var(--f-display);text-transform:uppercase;font-size:14px;letter-spacing:.1em;color:var(--cyan)}
input[type=text]{font:700 24px var(--f-body);color:var(--text);background:#0B0720;border:3px solid var(--line);clip-path:var(--cut-s);padding:12px 16px;width:100%;text-transform:uppercase;letter-spacing:.05em}
.hexes{display:flex;gap:10px;flex-wrap:wrap}
.hexes button{width:54px;height:54px;border:0;padding:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);position:relative}
.hexes button[aria-pressed="true"]::after{content:"";position:absolute;top:14px;right:14px;bottom:14px;left:14px;background:#fff;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}

/* map */
.hero{padding-top:26px;padding-bottom:8px;display:grid;gap:6px}
.hero h1{font-size:clamp(30px,7vw,50px)}
.hero p{margin:0;color:var(--muted);font-size:20px}
.path{display:grid;gap:0;padding-top:16px;padding-bottom:16px;position:relative}
.step{position:relative;display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:center}
.step+.step{margin-top:26px}
.step+.step::before{content:"";position:absolute;left:37px;top:-26px;height:26px;width:4px;background:repeating-linear-gradient(180deg,var(--line) 0 8px,transparent 8px 14px);background-size:4px 40px;animation:dash 1.2s linear infinite}
.step.go+.step::before{background:repeating-linear-gradient(180deg,var(--gold) 0 8px,transparent 8px 14px)}
.hex{width:76px;height:84px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:#fff;position:relative}
.step.cur .hex{background:var(--gold);color:var(--ink);animation:pulse 1.2s infinite}
.step.go .hex{background:var(--lime);color:#00331A}
.step.fin .hex{background:var(--violet)}
.node{display:block;width:100%;text-align:left;border:0;background:none;padding:0;min-width:0;color:inherit}
.node .panel{--acc:var(--line);transition:transform .12s}
.step.cur .panel{--acc:var(--gold)}.step.go .panel{--acc:var(--lime)}.step.fin .panel{--acc:var(--violet)}
.node:not([disabled]):hover .panel{transform:translateX(8px)}
.node[disabled]{cursor:not-allowed;opacity:.5}
.node h3{font-size:clamp(20px,4.6vw,28px)}
.node small{display:block;color:var(--muted);font-size:16px;font-weight:600;margin-top:2px}
.node .row2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stars{display:flex;gap:2px;flex:none}
.stars .ic{width:28px;height:28px;fill:#2C2370;stroke:none}
.stars .on .ic{fill:var(--gold);filter:drop-shadow(0 0 6px rgba(255,199,0,.8))}
.sec-t{font-size:22px;padding-top:22px;color:var(--gold)}
.badges{display:flex;gap:10px;flex-wrap:wrap;padding-top:10px}
.bdg{display:flex;align-items:center;gap:8px;background:var(--panel);clip-path:var(--cut-s);padding:8px 16px 8px 12px;font-family:var(--f-display);font-size:14px;text-transform:uppercase}
.bdg .ic{width:24px;height:24px}
.bdg.off{opacity:.35;filter:grayscale(1)}.bdg.on{color:var(--gold)}.bdg.on .ic{filter:drop-shadow(0 0 6px var(--gold))}

/* level */
.lh{padding-top:26px;padding-bottom:8px;display:grid;gap:8px}
.lh h1{font-size:clamp(36px,9vw,72px);color:#fff;text-shadow:4px 4px 0 var(--mag)}
.stage{display:flex;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:40;padding-top:10px;padding-bottom:10px;background:linear-gradient(180deg,var(--void) 70%,transparent)}
.stage a{flex:1;text-align:center;text-decoration:none;background:var(--panel);border:2px solid var(--line);transform:skewX(-12deg);padding:8px 4px;font-family:var(--f-display);text-transform:uppercase;font-size:14px}
.stage a>*{display:inline-block;transform:skewX(12deg)}
.stage a:hover{border-color:var(--gold)}
.quest{--acc:var(--gold)}
.quest b{font-family:var(--f-display);text-transform:uppercase;color:var(--gold);display:block;font-size:15px;letter-spacing:.1em}
.quest span{font-size:21px}
section{padding-top:22px;padding-bottom:6px;display:grid;gap:14px;scroll-margin-top:130px}
section>h2{font-size:30px;display:flex;align-items:baseline;gap:12px}
section>h2 small{font-family:var(--f-body);font-size:16px;color:var(--cyan);letter-spacing:.16em}
.cprog{font-weight:700;color:var(--muted);letter-spacing:.05em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.flip{perspective:1000px;background:none;border:0;padding:0;text-align:left;color:inherit}
.flip .in{display:grid;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:270px;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:var(--cut);padding:18px 18px 18px 22px;display:flex;flex-direction:column;gap:8px}
.face.f{overflow:hidden;background:repeating-linear-gradient(135deg,#1C1450 0 14px,#241A66 14px 28px);justify-content:space-between;position:relative}
.face.f::after{content:"";position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);animation:sweep 3.2s infinite;pointer-events:none}
.face.f .q{font-family:var(--f-display);font-size:72px;color:var(--cyan);line-height:1;text-shadow:0 0 22px rgba(25,211,255,.7)}
.face.f h3{font-size:22px}
.face.f .tap{font-size:14px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.face.b{background:linear-gradient(160deg,#1E5BFF,#6A2BE0);transform:rotateY(180deg);font-size:17.5px;line-height:1.3;overflow:hidden}
.face.b h4{font-size:20px;color:var(--gold)}
.face.b .ph{margin:-18px -18px 0 -22px;height:128px;flex:none;background:#0B0720;display:grid;place-items:center;position:relative;overflow:hidden}
.face.b .ph img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.face.b .ph .ic{width:56px;height:56px;color:var(--cyan)}
.face.b .like{background:rgba(11,7,32,.45);padding:8px 12px;font-weight:700;display:flex;gap:10px;align-items:center}
.lk{width:86px;height:86px;object-fit:cover;flex:none;clip-path:var(--cut-s)}
.face.b .like em{font-style:normal;color:var(--gold);font-family:var(--f-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;display:block}

.w{--acc:var(--cyan);position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));clip-path:var(--cut);padding:20px 22px 22px 26px;display:grid;gap:14px;min-width:0}
.w::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--acc)}
.w h3{font-size:26px}
.hint{margin:0;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.target{font-family:var(--f-display);text-transform:uppercase;font-size:clamp(24px,5.5vw,36px);text-align:center;padding:30px 16px;min-height:120px;display:grid;place-items:center;background:linear-gradient(180deg,#0B0720,#150E3D);clip-path:var(--cut);overflow-wrap:anywhere;animation:drop .45s cubic-bezier(.2,1.2,.4,1) both;line-height:1.15}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.opt{position:relative;background:var(--panel);border:0;border-left:8px solid var(--c,var(--line));padding:14px 16px;text-align:left;font-family:var(--f-body);font-weight:700;font-size:19px;display:flex;gap:10px;align-items:center;min-height:60px;clip-path:var(--cut-s);transition:transform .1s,background .15s;animation:slideR .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.opt:hover:not([disabled]){background:var(--panel2);transform:translateX(6px)}
.opt:active:not([disabled]){transform:scale(.97)}
.opt.ok{background:#0E5B37;border-left-color:var(--lime)}
.opt.no{background:#6A1730;border-left-color:var(--red);animation:shake .4s}
.opt .m{margin-left:auto;font-family:var(--f-display);font-size:22px}
.opt.ok .m{color:var(--lime)}.opt.no .m{color:var(--red)}
.cats{display:flex;flex-wrap:wrap;gap:12px}
.cats .opt{flex:1 1 160px;justify-content:center;text-align:center;font-family:var(--f-display);text-transform:uppercase;font-size:17px}
.qtext{font-family:var(--f-display);font-size:clamp(20px,4.4vw,28px);line-height:1.25;margin:0;text-transform:none;animation:slideL .45s cubic-bezier(.2,.8,.2,1) both}
.blank{display:inline-block;min-width:3.5em;border-bottom:4px solid var(--gold);text-align:center;margin-left:2px;margin-right:2px;color:var(--gold)}
.blank.f{color:var(--lime);border-color:var(--lime)}
.pips{display:flex;gap:6px}
.pips i{width:22px;height:10px;transform:skewX(-20deg);background:#2C2370;display:block}
.pips i.ok{background:var(--lime)}.pips i.no{background:var(--red)}.pips i.cur{background:var(--gold);animation:pulse 1s infinite}
.hud2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-display);font-size:clamp(20px,5vw,30px);color:var(--gold)}
.meter{height:12px;width:140px;background:#0B0720;transform:skewX(-20deg);border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mag),var(--gold));transition:width .25s}
.combo{font-family:var(--f-display);text-transform:uppercase;color:var(--mag);font-size:20px;min-width:110px;display:flex;align-items:center;gap:6px}
.combo.on{animation:pulse .35s}
.timer{height:10px;background:#0B0720;transform:skewX(-20deg);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--violet)}
.byte{display:flex;gap:12px;align-items:flex-start;min-height:64px}
.byte svg{flex:none;width:62px;height:62px}
.bubble{position:relative;background:#0B0720;padding:10px 16px;flex:1;min-width:0;border-left:5px solid var(--cyan);font-size:18px;line-height:1.3;animation:slideR .3s both}
.bubble.ok{border-color:var(--lime)}.bubble.no{border-color:var(--red)}
.result{display:grid;gap:14px;justify-items:start}
.big{font-family:var(--f-display);font-size:72px;line-height:1;color:#fff;text-shadow:4px 4px 0 var(--mag)}
.xpg{display:inline-block;background:var(--gold);color:var(--ink);font-family:var(--f-display);padding:4px 16px;transform:skewX(-10deg);animation:slam .5s both}
.miss{display:grid;gap:6px;width:100%}
.miss div{background:#3A1330;border-left:5px solid var(--red);padding:6px 12px;font-size:17px}

/* boss arena */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:linear-gradient(180deg,#0B0720,#1A0F4A);clip-path:var(--cut);padding:14px 18px}
.fighter{display:grid;gap:6px;justify-items:center;min-width:0}
.fighter .nm{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.vs{font-family:var(--f-display);font-size:34px;color:var(--mag);text-shadow:3px 3px 0 #4A0A28}
.hearts{display:flex;gap:4px}
.hearts svg{width:26px;height:26px}
.hp{display:flex;gap:4px;width:100%;max-width:200px}
.hp i{flex:1;height:14px;background:var(--red);transform:skewX(-20deg);transition:background .2s,transform .3s}
.hp i.lost{background:#2C1730;transform:skewX(-20deg) scaleY(.5)}
.bossw{width:92px;height:92px}
.hit{animation:shake .4s}
.flashfx{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;pointer-events:none;animation:flash .4s forwards}
.fl{position:fixed;z-index:80;pointer-events:none;font-family:var(--f-display);font-size:34px;color:var(--gold);text-shadow:3px 3px 0 #000;animation:floatUp .9s forwards}

/* overlays */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;display:grid;place-items:center;overflow:hidden;background:rgba(11,7,32,.0)}
.ov .p1,.ov .p2{position:absolute;top:-10%;bottom:-10%;width:60%;transition:transform .45s cubic-bezier(.7,0,.2,1)}
.ov .p1{left:-10%;background:var(--mag);transform:translateX(-130%) skewX(-14deg)}
.ov .p2{right:-10%;background:var(--violet);transform:translateX(130%) skewX(-14deg)}
.ov.in .p1,.ov.in .p2{transform:translateX(0) skewX(-14deg)}
.ov .tx{position:relative;text-align:center;display:grid;gap:10px;padding:20px}
.ov .tx .a{font-family:var(--f-display);font-size:clamp(20px,5vw,30px);letter-spacing:.3em;color:var(--gold);opacity:0;animation:slideL .4s .3s forwards}
.ov .tx .b{font-family:var(--f-display);font-size:clamp(44px,13vw,120px);line-height:.95;color:#fff;text-shadow:5px 5px 0 #000;opacity:0;animation:slam .5s .45s both;text-transform:uppercase}
.ov .tx .c{font-size:22px;max-width:30ch;margin:0 auto;opacity:0;animation:up .5s .8s forwards}
.ov.out{opacity:0;transition:opacity .35s}
.ov.win .p1{background:var(--lime)}.ov.win .p2{background:var(--cyan)}.ov.win .tx .b{color:#fff}

    const lines=STORY[n];let li=0,ch=0,timer=null,typing=false;

    o.innerHTML=`<button class="skip" id="sk">Skip</button><div class="bgboss" aria-hidden="true">${bossSVG(LEVELS[n-1].boss[1],'idle')}</div><div class="bx"><div class="bz">${byteSVG('idle')}</div><div class="bt"><div class="who">Byte · Mission briefing</div><p id="bl" aria-live="polite"></p><div class="go">Tap to continue</div></div></div>`;
    document.body.appendChild(o);const p=$('#bl',o);
    const finish=()=>{clearInterval(timer);if(TTS)try{TTS.stop()}catch(e){}o.remove();res()};
    function startLine(){ch=0;typing=true;p.textContent='';speak(lines[li]);clearInterval(timer);

function xpOf(){
  let x=0;
  Object.values(S.cards).forEach(a=>x+=a.filter(Boolean).length*5);
  Object.values(S.teach).forEach(a=>x+=a.filter(Boolean).length*5);
  Object.values(S.think).forEach(a=>x+=a.filter(t=>t&&t.trim().length>8).length*10);
  Object.values(S.task).forEach(o=>x+=(o.a?10:0)+(o.p?10:0));
  Object.values(S.games).forEach(v=>x+=v);
  Object.values(S.boss).forEach(v=>{x+=v*20;if(v===5)x+=50;if(v>=3)x+=100});
  x+=S.final*15;if(S.final===10)x+=100;

}

/* ---------- audio: sfx + chiptune music ---------- */
let AC=null,MG=null,NB=null;
function actx(){
  if(AC)return AC;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=1;MG.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}
  return AC;
}
function tone(f,t,d,type='square',v=.08,dest){
  const c=actx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(dest||MG);o.start(t);o.stop(t+d+.02);
}
function noise(t,d,v,hp){
  const c=actx();if(!c)return;const s=c.createBufferSource();s.buffer=NB;const g=c.createGain(),f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d);
}
const now=()=>AC?AC.currentTime:0;
const sfx={
  ok(){if(!S.sfx||!actx())return;const t=now();tone(659,t,.1);tone(880,t+.09,.1);tone(1175,t+.18,.2)},
  no(){if(!S.sfx||!actx())return;const t=now();tone(220,t,.2,'sawtooth',.09);tone(150,t+.12,.3,'sawtooth',.09)},
  tap(){if(!S.sfx||!actx())return;tone(520,now(),.06,'square',.05)},
  flip(){if(!S.sfx||!actx())return;const t=now();tone(330,t,.08);tone(660,t+.07,.12)},
  hit(){buzz(60);if(!S.sfx||!actx())return;const t=now();noise(t,.18,.25,300);tone(110,t,.2,'sawtooth',.12)},
  win(){if(!S.sfx||!actx())return;const t=now();[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.1,.3,'square',.08))},
  lose(){if(!S.sfx||!actx())return;const t=now();[392,330,262,196].forEach((f,i)=>tone(f,t+i*.18,.35,'sawtooth',.08))},
  whoosh(){if(!S.sfx||!actx())return;noise(now(),.35,.12,1500)},
  up(){if(!S.sfx||!actx())return;const t=now();[392,523,659,784,1047,784,1047].forEach((f,i)=>tone(f,t+i*.08,.2,'triangle',.1))}
};
/* music: 16-step bar, Am F C G. "menu" is relaxed, "battle" adds drums and runs faster. */
const MU={mode:'menu',step:0,next:0,timer:null,on:false};
const ROOTS=[110,87.31,130.81,98],TRI=[[1,1.2,1.5],[1,1.25,1.5],[1,1.25,1.5],[1,1.25,1.5]];
const MEL=[0,4,2,4, 5,4,2,0, 4,5,7,5, 4,2,0,2];
const PENT=[440,523.25,587.33,659.25,783.99,880,1046.5,1174.66];
function schedule(){
  const c=actx();if(!c)return;const bpm=MU.mode==='battle'?142:112,sd=60/bpm/4;
  while(MU.next<c.currentTime+.18){
    const s=MU.step%64,bar=(s>>4)&3,p=s&15,t=MU.next,r=ROOTS[bar],v=MU.mode==='battle'?1:.7;
    if(p%2===0)tone(r*2*(TRI[bar][(p/2|0)%3]),t,sd*1.6,'square',.025*v);
    if(p%4===0||(MU.mode==='battle'&&p%4===2))tone(r,t,sd*1.8,'triangle',.11*v);
    if(p%2===0&&(bar%2===1||MU.mode==='battle'))tone(PENT[MEL[p]%8],t,sd*1.4,'square',.03*v);
    if(MU.mode==='battle'){if(p%4===0){tone(120,t,.1,'sine',.18);noise(t,.04,.06,5000)}if(p===4||p===12)noise(t,.12,.14,1200);if(p%2===1)noise(t,.03,.04,7000)}
    else if(p%4===0)noise(t,.03,.03,6000);
    MU.next+=sd;MU.step++;
  }
}
function musicSet(mode){
  MU.mode=mode;if(!S.music||MU.on)return;const c=actx();if(!c)return;
  if(c.state==='suspended')c.resume();MU.on=true;MU.next=c.currentTime+.05;MU.timer=setInterval(schedule,40);
}
function musicStop(){clearInterval(MU.timer);MU.on=false}
function musicSync(){if(S.music)musicSet(MU.mode);else musicStop()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicStop();else musicSync()});

/* ---------- visuals: rain, particles, floaters, overlays ---------- */
(function rain(){
  const cv=$('#rain'),cx=cv.getContext('2d');let cols=[],W=0,H=0,last=0;
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;cols=Array.from({length:Math.ceil(W/26)},()=>({y:Math.random()*H,s:2+Math.random()*3}))}
  size();addEventListener('resize',size);
  function draw(t){
    if(document.body.classList.contains('lite')){if(t-last>500){last=t;cx.clearRect(0,0,W,H)}}else if(!document.hidden&&t-last>60){last=t;cx.clearRect(0,0,W,H);cx.font='700 16px monospace';
      cols.forEach((c,i)=>{c.y+=c.s;if(c.y>H+20){c.y=-20;c.s=2+Math.random()*3}
        for(let k=0;k<6;k++){cx.fillStyle=`rgba(25,211,255,${.5-k*.08})`;cx.fillText(Math.random()<.5?'0':'1',i*26,c.y-k*18)}})}
    if(!RM)requestAnimationFrame(draw)}
  if(RM){size();cx.font='700 16px monospace';cols.forEach((c,i)=>{for(let k=0;k<4;k++){cx.fillStyle='rgba(25,211,255,.2)';cx.fillText(Math.random()<.5?'0':'1',i*26,c.y-k*18)}})}else requestAnimationFrame(draw);
})();
function burst(n=80,x,y){
  if(document.body.classList.contains('lite'))n=Math.ceil(n/3);
  if(RM)return;const cv=$('#fx'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cs=['#FFC700','#19D3FF','#3CFF8F','#FF2E88','#8A5CFF','#fff'];x=x==null?innerWidth/2:x;y=y==null?innerHeight*.45:y;
  const ps=Array.from({length:n},()=>({x,y,vx:(Math.random()-.5)*16,vy:-Math.random()*14-2,r:4+Math.random()*7,c:cs[Math.random()*6|0],a:Math.random()*6}));
  let f=0;(function st(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.3;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.7);cx.restore()});if(++f<90)requestAnimationFrame(st);else cx.clearRect(0,0,cv.width,cv.height)})();
}
function floatTxt(txt,el,color){
  const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0};
  const d=document.createElement('div');d.className='fl';d.textContent=txt;d.style.left=(r.left+r.width/2-30)+'px';d.style.top=(r.top-6)+'px';if(color)d.style.color=color;
  document.body.appendChild(d);setTimeout(()=>d.remove(),950);
}
function flashFx(color){const d=document.createElement('div');d.className='flashfx';d.style.background=color;document.body.appendChild(d);setTimeout(()=>d.remove(),450)}
function shakeScreen(){buzz(80);document.body.classList.add('shk');setTimeout(()=>document.body.classList.remove('shk'),380)}
function overlay(kind,a,b,c,ms=2200){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='ov '+(kind||'');o.innerHTML=`<div class="p1"></div><div class="p2"></div><div class="tx"><div class="a">${esc(a)}</div><div class="b">${esc(b)}</div>${c?`<div class="c">${esc(c)}</div>`:''}</div>`;
    document.body.appendChild(o);sfx.whoosh();requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('in')));
    let closed=false;const close=()=>{if(closed)return;closed=true;o.classList.add('out');setTimeout(()=>{o.remove();res()},350)};
    o.onclick=close;setTimeout(close,ms);
  });
}
function revealOnScroll(root){
  if(!('IntersectionObserver'in window)||RM)return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('pre');e.target.classList.add('rv');io.unobserve(e.target)}}),{threshold:.08});
  root.querySelectorAll('[data-rv]').forEach(el=>{const r=el.getBoundingClientRect();if(r.top>innerHeight){el.classList.add('pre');io.observe(el)}});
  setTimeout(()=>root.querySelectorAll('.pre').forEach(el=>{el.classList.remove('pre')}),20000);
}

let lastLv=null;
function paintHud(){
  const x=xpOf(),lv=lvlOf(x);
  if(S.name){
    $('#hud').innerHTML=`<div class="xpbox"><div class="t"><span>${esc(titleOf(x))}</span><span>LV ${lv}</span></div><div class="xpbar"><i style="width:${(x%250)/250*100}%"></i></div></div><span class="score" style="font-size:18px">${x} XP</span>
    <div class="nv"><button id="nm" aria-pressed="${route.cur==='map'||/^l\d/.test(route.cur)}">${ic('map')}<span class="lab">Map</span></button><button id="nmu" class="${S.music?'':'off'}" aria-label="Music" aria-pressed="${S.music}">${ic('music')}</button><button id="nsx" class="${S.sfx?'':'off'}" aria-label="Sound effects" aria-pressed="${S.sfx}">${ic('sound')}</button>${TTS?`<button id="nvo" class="${S.voice?'':'off'}" aria-label="Byte voice" aria-pressed="${!!S.voice}">${ic('voice')}</button>`:''}<button id="nlt" class="${S.lite?'':'off'}" aria-label="Lite mode for slow tablets" aria-pressed="${!!S.lite}">${ic('bolt')}</button>${document.documentElement.requestFullscreen?`<button id="nfs" aria-label="Full screen">${ic('full')}</button>`:''}</div>
    <span class="av" style="background:${S.color}" title="${esc(S.name)}">${esc(S.name[0].toUpperCase())}</span>`;
    $('#nm').onclick=()=>location.hash='map';
    $('#nmu').onclick=()=>{S.music=!S.music;save();musicSync();paintHud()};$('#nsx').onclick=()=>{S.sfx=!S.sfx;save();sfx.tap();paintHud()};
    const vo=$('#nvo');if(vo)vo.onclick=()=>{S.voice=!S.voice;save();paintHud();if(S.voice)speak('Hi! I am Byte. I will read the mission briefings to you.')};
    $('#nlt').onclick=()=>{S.lite=!S.lite;document.body.classList.toggle('lite',!!S.lite);save();paintHud()};
    const fs=$('#nfs');if(fs)fs.onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
  }else $('#hud').innerHTML='';
  if(lastLv!==null&&lv>lastLv){sfx.up();burst(120);overlay('win','LEVEL UP',`LV ${lv}`,`You are now a ${titleOf(x)}`,2000)}
  lastLv=lv;
}

  const h=location.hash.slice(1)||'map';route.cur=h;

  const m=h.match(/^l([1-4])$/);
  if(m)level(+m[1]);else if(h==='final')finalRound();else mapView();

function setupStages(){
  const names=['learn','cards','play','boss','home'];

    sec.appendChild(nav);
  });

  }

}

/* ---------- MCQ runner: used by boss battles and the grand challenge ---------- */
function mcqRun(el,qs,opt){
  let i=0,score=0,hearts=3,hist=[],timer=null;
  const bs=opt.boss;
  function pips(){return `<div class="pips">${qs.map((_,k)=>`<i class="${hist[k]===undefined?(k===i?'cur':''):hist[k]?'ok':'no'}"></i>`).join('')}</div>`}
  function arena(mood){
    if(!bs)return '';
    return `<div class="arena"><div class="fighter"><span class="av" style="background:${S.color};width:70px;height:70px;font-size:28px">${esc(S.name[0].toUpperCase())}</span><span class="nm">${esc(S.name)}</span><div class="hearts" id="ht">${[0,1,2].map(k=>heart(k<hearts)).join('')}</div></div><div class="vs">VS</div><div class="fighter" id="bf">${bossSVG(bs[1],mood||'idle')}<span class="nm" style="color:${bs[1]}">${esc(bs[0])}</span><div class="hp" aria-label="Boss health">${qs.map((_,k)=>`<i class="${k<score?'lost':''}" style="background:${k<score?'':bs[1]}"></i>`).join('')}</div></div></div>`;
  }
  function draw(){
    clearInterval(timer);
    if(i>=qs.length||hearts<=0)return opt.done(score,qs.length,el,hearts<=0);
    const q=qs[i];
    el.innerHTML=`${arena()}<div class="hud2"><span class="eyebrow">${bs?'Round':'Question'} ${i+1} of ${qs.length}</span>${pips()}</div>${opt.time?'<div class="timer" aria-hidden="true"><i id="tm"></i></div>':''}
    <p class="qtext" id="qt">${esc(q.q).replace(/_{3,}/,'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>')}</p>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt" style="--i:${k};--c:${CATC[k%5]}" data-k="${k}"><span>${esc(o.t)}</span><span class="m"></span></button>`).join('')}</div>
    <div class="byte" id="by"></div><div id="nx"></div>`;
    say($('#by',el),'idle',opt.time?'Be quick, but think!':bs?'Answer right to hit the boss. Three wrong answers and you lose.':'Take your time.');
    const lock=(good,btn)=>{
      clearInterval(timer);
      el.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(q.opts[k].ok){x.classList.add('ok');x.querySelector('.m').textContent='✓'}});
      const right=q.opts.find(x=>x.ok).t;$('#qt',el).innerHTML=esc(q.q).replace(/_{3,}/,`<span class="blank f">${esc(right)}</span>`);
      hist[i]=good;
      if(good){score++;sfx.ok();if(bs){sfx.hit();const f=$('#bf',el);f&&(f.innerHTML=bossSVG(bs[1],'hit')+f.innerHTML.slice(f.innerHTML.indexOf('</svg>')+6));f&&f.classList.add('hit');floatTxt('HIT!',f,'#3CFF8F');flashFx('rgba(60,255,143,.25)');
        const seg=el.querySelectorAll('.hp i')[score-1];seg&&(seg.classList.add('lost'),seg.style.background='')}else{floatTxt('+1',btn,'#3CFF8F')}}
      else{hearts--;sfx.no();shakeScreen();flashFx('rgba(255,71,87,.3)');if(bs){const h=$('#ht',el);h&&(h.innerHTML=[0,1,2].map(k=>heart(k<hearts)).join(''))}}
      say($('#by',el),good?'ok':'no',(good?pick(CHEER):pick(OOPS))+' '+q.why);
      const last=i===qs.length-1||hearts<=0;
      $('#nx',el).innerHTML=`<button class="btn" id="n"><span>${last?'See result':'Next'}</span></button>`;
      const nb=$('#n',el);nb.onclick=()=>{sfx.tap();i++;draw();toTopOf(el)};nb.focus({preventScroll:true});
    };
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=q.opts[+b.dataset.k];if(!o.ok){b.classList.add('no');b.querySelector('.m').textContent='✗'}lock(o.ok,b)});
    if(opt.time){const t0=Date.now();timer=setInterval(()=>{const f=1-(Date.now()-t0)/(opt.time*1000);const tm=$('#tm',el);if(tm)tm.style.width=Math.max(0,f*100)+'%';if(f<=0){clearInterval(timer);lock(false)}},100)}
  }
  draw();
}
function mkQ(l,k){const m=MCQ[l][k];return {q:m.q,opts:shuffle(m.o.map((t,j)=>({t,ok:j===ANS[l][k]}))),why:WHY[l][k]}}

function boss(el,n){
  const l=n-1,L=LEVELS[l];
  function intro(){
    el.innerHTML=`<div class="arena" style="margin-bottom:6px"><div class="fighter"><span class="av" style="background:${S.color};width:70px;height:70px;font-size:28px">${esc(S.name[0].toUpperCase())}</span><span class="nm">${esc(S.name)}</span></div><div class="vs">VS</div><div class="fighter">${bossSVG(L.boss[1],'idle')}<span class="nm" style="color:${L.boss[1]}">${esc(L.boss[0])}</span></div></div>
    <p class="hint">5 rounds. Each right answer hits the boss. You have 3 lives. Land 3 hits to win, 5 hits for three stars.</p>
    <div><button class="btn mg" id="fight"><span>Fight!</span></button></div>`;
    $('#fight',el).onclick=async()=>{actx();await overlay('lose','Boss battle',L.boss[0],'Answer right to hit. Three wrong answers and you lose.',1700);musicSet('battle');MU.mode='battle';fight()};
  }
  function fight(){
    const qs=shuffle([0,1,2,3,4]).map(k=>mkQ(l,k));
    el.innerHTML='<div id="bq" style="display:grid;gap:14px"></div>';
    mcqRun($('#bq',el),qs,{boss:L.boss,done:async(score,total,box,dead)=>{
      MU.mode='menu';
      const prev=S.boss[n]||0,first=!done(n);const before=xpOf();S.boss[n]=Math.max(prev,score);save();
      const gain=xpOf()-before,ok=score>=3;
      box.innerHTML=`<div class="result"><div class="eyebrow">Battle report</div><div class="big">${score}<span style="font-size:30px"> / ${total}</span></div>${stars(score>=5?3:score>=4?2:score>=3?1:0)}${gain>0?`<span class="xpg">+${gain} XP</span>`:''}<div class="byte" id="by2" style="width:100%"></div><div class="row" style="justify-content:flex-start"><button class="btn gh" id="re"><span>Rematch</span></button>${ok&&n<4?`<a class="btn" href="#l${n+1}"><span>Next level</span></a>`:''}${ok&&n===4?`<a class="btn" href="#final"><span>Grand Challenge</span></a>`:''}</div></div>`;
      say($('#by2',box),ok?'ok':'no',score===5?'PERFECT! The boss never had a chance.':ok?'Boss defeated! Next level unlocked. Fight again for more stars.':'You were beaten this time. Reveal the cards again, play the games and come back.');
      $('#re',box).onclick=()=>{musicSet('battle');MU.mode='battle';intro()};
      if(ok){sfx.win();burst(130)}else sfx.lose();
      paintHud();
      await overlay(ok?'win':'lose',ok?'Victory':'Defeated',ok?'Boss down':'Try again',ok?EPI[n]:'',2400);
      musicSet('menu');
    }});
  }
  intro();
}

/* ---------- sort game ---------- */
function sortGame(def){
  return (el,n,gi)=>{
    let deck,i,pts,ok,combo,miss,best;const key=n+'.'+gi;
    function start(){deck=shuffle(def.items).slice(0,def.n||8);i=0;pts=0;ok=0;combo=0;miss=[];best=0;draw()}
    function draw(){
      if(i>=deck.length)return finish();
      const it=deck[i];
      el.innerHTML=`<h3><span class="skew">${esc(def.title)}</span></h3><p class="hint">${esc(def.intro)}</p>
      <div class="hud2"><span class="eyebrow">Target ${i+1} of ${deck.length}</span><span class="combo ${combo>=2?'on':''}">${combo>=2?ic('flame')+' Combo x'+combo:''}</span><div class="meter" aria-hidden="true"><i style="width:${Math.min(combo,5)*20}%"></i></div><span class="score">${pts}</span></div>
      <div class="target ${(it.img||it.svg)?'pic':''}" aria-live="polite">${it.svg?topoSVG(it.svg):it.img?`<img src="img/${it.img}.jpg" alt="Picture to identify">`:esc(it.t)}</div>
      <div class="cats">${def.cats.map((c,k)=>`<button class="opt" style="--i:${k};--c:${CATC[k%5]}" data-k="${k}">${esc(c.n)}</button>`).join('')}</div>
      <div class="byte" id="by"></div><div id="nx"></div>`;
      say($('#by',el),'idle',def.prompt||'Pick the right team. Fast answers in a row build your combo.');
      el.querySelectorAll('.cats .opt').forEach(b=>b.onclick=()=>{
        const k=+b.dataset.k,right=k===it.c;
        el.querySelectorAll('.cats .opt').forEach((x,j)=>{x.disabled=true;if(j===it.c)x.classList.add('ok')});
        if(right){combo++;best=Math.max(best,combo);ok++;const g=10+Math.min(combo-1,5)*2;pts+=g;sfx.ok();floatTxt('+'+g,b,'#FFC700');if(combo===3||combo===5||combo===8)burst(50,innerWidth/2,innerHeight/2)}
        else{b.classList.add('no');combo=0;miss.push(it);sfx.no();shakeScreen()}
        say($('#by',el),right?'ok':'no',(right?pick(CHEER):pick(OOPS))+' '+def.cats[it.c].n+': '+def.cats[it.c].info);
        $('#nx',el).innerHTML=`<button class="btn" id="n"><span>${i===deck.length-1?'Finish':'Next'}</span></button>`;
        const nb=$('#n',el);nb.onclick=()=>{sfx.tap();i++;draw();toTopOf(el)};nb.focus({preventScroll:true});
      });
    }
    function finish(){
      const prev=S.games[key]||0,gain=Math.max(0,pts-prev);S.games[key]=Math.max(prev,pts);S.best=Math.max(S.best,best);save();
      if(ok===deck.length){sfx.win();burst(90)}else if(ok>=deck.length/2)sfx.ok();
      el.innerHTML=`<h3><span class="skew">${esc(def.title)}</span></h3><div class="result"><div class="eyebrow">Result</div><div class="big">${ok}<span style="font-size:30px"> / ${deck.length}</span></div><span class="score">${pts} points · best combo x${best}</span>${gain>0?`<span class="xpg">+${gain} XP</span>`:`<span class="hint">Beat your best of ${prev} points to earn more XP.</span>`}
      ${miss.length?`<div class="miss">${miss.map(m=>`<div>${esc(m.t)} belongs with <b>${esc(def.cats[m.c].n)}</b></div>`).join('')}</div>`:'<p style="margin:0;font-weight:700;color:var(--lime)">Flawless run.</p>'}
      <button class="btn" id="re"><span>Play again</span></button></div>`;
      $('#re',el).onclick=start;paintHud();
    }
    start();
  };
}

/* ---------- special widgets ---------- */
function stackGame(el,n,gi){
  const layers=[['Hardware','The touchable parts: screen, keyboard, processor','l0'],['Operating system','System software that runs the hardware','l1'],['Application software','Word, Excel, browsers','l2'],['You, the user','Tapping, typing and clicking','l3']];
  let placed=0,mistakes=0;
  function draw(fin){
    const pool=layers.map((l,i)=>[l,i]).filter(([,i])=>i>=placed);
    el.innerHTML=`<h3><span class="skew">Build the stack</span></h3><p class="hint">A computer works in layers. Tap the layers one at a time, starting from the very bottom.</p>
    <div class="stack">${layers.slice().reverse().map((l,ri)=>{const i=3-ri;return `<div class="layer ${i<placed?'placed '+l[2]:''}"><span>${i<placed?l[0]:'Empty slot'}</span><small>${i<placed?l[1]:'Layer '+(i+1)+' from the bottom'}</small></div>`}).join('')}</div>
    ${fin?'':`<div class="pool">${shuffle(pool).map(([l,i])=>`<button class="opt" style="--c:${CATC[i]}" data-i="${i}">${l[0]}</button>`).join('')}</div>`}<div class="byte" id="by"></div>`;
    say($('#by',el),fin?'ok':'idle',fin?'Perfect stack! You talk to apps, apps talk to the operating system, and the operating system controls the hardware.':'Think: what must exist first before anything else can run?');
    el.querySelectorAll('.pool .opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===placed){placed++;sfx.ok();if(placed===4){const pts=Math.max(10,40-mistakes*10),prev=S.games[n+'.'+gi]||0;S.games[n+'.'+gi]=Math.max(prev,pts);save();burst(70);sfx.win();draw(true);paintHud();return}draw(false)}
      else{mistakes++;b.classList.add('no');sfx.no();shakeScreen();say($('#by',el),'no','Not yet. Which layer sits underneath everything else?')}
    });
  }
  draw(false);
}
function flowGame(el,n,gi){
  const steps=[[3,'You tap the Word icon.'],[2,'Word (application software) asks the operating system for a place to run.'],[1,'The operating system gives Word some memory and tells the processor to start it.'],[0,'The hardware does the work. The screen lights up with a blank page.'],[1,'The operating system sends the picture to the screen. You see Word, ready to type. Without the OS in the middle, none of this would happen.']];
  let k=0;
  function draw(){
    const act=steps[k][0];
    el.innerHTML=`<h3><span class="skew">Follow a tap</span></h3><p class="hint">What happens inside the computer when you open Word? Step through it.</p>
    <div class="stack">${[3,2,1,0].map(i=>{const L=[['Hardware','l0'],['Operating system','l1'],['Application software','l2'],['You','l3']][i];return `<div class="layer placed ${L[1]} ${i===act?'act':''}"><span>${L[0]}</span></div>`}).join('')}</div>
    <div class="flowtext" aria-live="polite">Step ${k+1} of ${steps.length}. ${steps[k][1]}</div>
    <div class="row"><button class="btn gh" id="pv" ${k?'':'disabled'}><span>Back</span></button><button class="btn" id="nx"><span>${k<steps.length-1?'Next step':'Start again'}</span></button></div>`;
    $('#pv',el).onclick=()=>{sfx.tap();k--;draw()};
    $('#nx',el).onclick=()=>{sfx.tap();if(k<steps.length-1){k++;if(k===steps.length-1&&!S.games[n+'.'+gi]){S.games[n+'.'+gi]=15;save();floatTxt('+15 XP',$('#nx',el),'#FFC700');burst(40);paintHud()}}else k=0;draw()};
  }
  draw();
}
function compressGame(el,n,gi){
  const F=[['Class photos',18],['Project video',30],['Notes (Word)',4]];let comp=false;const sel=[true,true,true];

function TOPO(type){
  const nodes=[],edges=[];
  const pc=(i,x,y)=>nodes.push({id:'pc'+i,x:Math.round(x),y:Math.round(y),k:'pc',label:'PC'+i});
  if(type==='bus'){
    [[70,48],[170,48],[270,48],[70,182],[170,182],[270,182]].forEach((p,i)=>pc(i+1,p[0],p[1]));
    [70,170,270].forEach((x,i)=>nodes.push({id:'j'+i,x,y:115,k:'j'}));
    edges.push({id:'b0',a:'j0',b:'j1',kind:'bus'},{id:'b1',a:'j1',b:'j2',kind:'bus'});
    [0,1,2,0,1,2].forEach((j,i)=>edges.push({id:'d'+(i+1),a:'pc'+(i+1),b:'j'+j,kind:'drop'}));
  }else if(type==='star'){
    nodes.push({id:'hub',x:160,y:115,k:'hub',label:'HUB'});
    for(let i=0;i<6;i++){const a=(i*60-90)*Math.PI/180;pc(i+1,160+115*Math.cos(a),115+78*Math.sin(a))}
    for(let i=1;i<=6;i++)edges.push({id:'s'+i,a:'pc'+i,b:'hub',kind:'spoke'});
  }else{
    for(let i=0;i<6;i++){const a=(i*60-90)*Math.PI/180;pc(i+1,160+110*Math.cos(a),115+76*Math.sin(a))}
    for(let i=1;i<=6;i++)edges.push({id:'r'+i,a:'pc'+i,b:'pc'+(i%6+1),kind:'ring',dir:true});
  }
  return {nodes,edges};
}

  return s;

function findPath(T,src,dst,cut,off){
  const adj={};T.nodes.forEach(n=>adj[n.id]=[]);
  T.edges.forEach(e=>{if(cut[e.id]||off[e.a]||off[e.b])return;adj[e.a].push(e.b);if(!e.dir)adj[e.b].push(e.a)});
  if(off[src]||off[dst])return null;
  const prev={};prev[src]=null;const q=[src];
  while(q.length){const u=q.shift();if(u===dst)break;adj[u].forEach(v=>{if(!(v in prev)){prev[v]=u;q.push(v)}})}
  if(!(dst in prev))return null;
  const p=[];for(let u=dst;u!==null;u=prev[u])p.unshift(u);return p;
}

        if(busy)return;
        const nd=e.target.closest('.nd'),hit=e.target.closest('.hit');
        if(mode==='cut'&&hit){const id=hit.dataset.e;cut[id]=!cut[id];sfx.tap();msg=cut[id]?'no:Cable cut. Now try sending a message.':'ok:Cable repaired.';render();return}
        if(mode==='off'&&nd){const id=nd.dataset.n;off[id]=!off[id];sfx.tap();msg=off[id]?'no:'+label(id)+' is off.':'ok:'+label(id)+' is back on.';render();return}
        if(mode==='send'&&nd){
          const id=nd.dataset.n;if(N[id].k==='hub'){msg='idle:The hub passes messages along. Choose two computers.';render();return}
          if(!src){src=id;sfx.tap();render();return}
          if(src===id){src=null;render();return}
          send(src,id);
        }
      };
    }
    function send(a,b){
      busy=true;const path=findPath(T,a,b,cut,off);src=null;
      const sv=$('#sv',el);
      if(!path){
        sfx.no();shakeScreen();seenFail=true;msg='no:Message from '+label(a)+' to '+label(b)+' failed. '+explainFail(a,b);busy=false;render();check();return;
      }
      const pts=path.map(id=>N[id]);let len=[0];for(let i=1;i<pts.length;i++)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
      const total=len[len.length-1],dur=Math.max(900,Math.min(2400,total*7));
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('r','8');dot.setAttribute('fill','#3CFF8F');dot.setAttribute('stroke','#fff');dot.setAttribute('stroke-width','2');sv.appendChild(dot);
      const t0=Date.now();sfx.whoosh();
      (function step(){
        const f=Math.min(1,(Date.now()-t0)/dur),d=f*total;let i=1;while(i<len.length-1&&len[i]<d)i++;
        const k=(d-len[i-1])/((len[i]-len[i-1])||1);dot.setAttribute('cx',pts[i-1].x+(pts[i].x-pts[i-1].x)*k);dot.setAttribute('cy',pts[i-1].y+(pts[i].y-pts[i-1].y)*k);
        if(f<1)setTimeout(step,30);else{
          const route=path.filter(id=>N[id].k!=='j').map(label).join(' → ');
          seenOK=true;sfx.ok();msg='ok:Message arrived! '+route+'.';busy=false;render();check();
        }
      })();
    }
    function check(){
      if(seenOK&&seenFail&&!S.games[n+'.'+gi]){S.games[n+'.'+gi]=20;save();burst(70);sfx.win();floatTxt('+20 XP',$('#sv',el),'#FFC700');paintHud()}
    }
    render();
  };
}


function slideExtra(t,box){
  const mdx=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  if(!t.type){box.innerHTML='';return}
  if(t.type==='explore'){
    box.innerHTML=`<div class="topo"><svg viewBox="0 0 320 230" role="img" aria-label="${t.topo} topology with numbered parts">${drawTopo(t.topo,{labels:false,marks:t.parts})}</svg></div><div class="xinfo" id="xi">Tap a gold number on the picture to learn about that part.</div>`;
    const seen={};
    box.querySelectorAll('.mk').forEach(g=>g.onclick=()=>{const p=t.parts[+g.dataset.i];seen[g.dataset.i]=1;sfx.tap();$('#xi',box).innerHTML='<b>'+esc(p.t)+'</b><br>'+esc(p.d)+'<br><span style="color:var(--muted);font-size:15px">Parts seen: '+Object.keys(seen).length+' of '+t.parts.length+'</span>'});
    return;
  }
  if(t.type==='watch'){
    const T=TOPO(t.topo),N={};T.nodes.forEach(n=>N[n.id]=n);const path=findPath(T,t.from,t.to,{},{});let k=0;
    const draw=()=>{
      const st=t.steps[k];let hl='';
      for(let i=1;i<=st.at;i++){const a=N[path[i-1]],b=N[path[i]];hl+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#3CFF8F" stroke-width="7" stroke-linecap="round" opacity=".85"/>`}
      const c=N[path[st.at]];
      box.innerHTML=`<div class="topo"><svg viewBox="0 0 320 230" role="img" aria-label="Message travelling in a ${t.topo} network">${drawTopo(t.topo,{})}${hl}<circle cx="${c.x}" cy="${c.y}" r="9" fill="#3CFF8F" stroke="#fff" stroke-width="2"/></svg></div>
      <div class="xinfo" aria-live="polite"><b>Step ${k+1} of ${t.steps.length}.</b> ${mdx(st.text)}</div>
      <div class="row" style="margin-top:8px"><button class="btn gh" id="wb" ${k?'':'disabled'}><span>Previous step</span></button><button class="btn cy" id="wn" ${k<t.steps.length-1?'':'disabled'}><span>Next step</span></button></div>`;
      $('#wb',box).onclick=()=>{k--;sfx.tap();draw()};$('#wn',box).onclick=()=>{k++;sfx.ok();draw()};
    };
    draw();return;
  }
  if(t.type==='counter'){
    let n=4;
    const draw=()=>{
      const bus=6+n,star=6*n;
      box.innerHTML=`<div class="row" style="justify-content:flex-start;margin-top:6px"><button class="btn gh" id="cm" ${n>2?'':'disabled'}><span>− computer</span></button><span class="score" style="font-size:24px">${n} computers</span><button class="btn gh" id="cp2" ${n<8?'':'disabled'}><span>+ computer</span></button></div>
      <div class="xbar"><div class="r"><span class="lab" style="color:var(--gold)">Bus</span><span class="bars"><i class="m" style="width:60%"></i>${Array.from({length:n},()=>'<i style="width:10%"></i>').join('')}</span><span class="num">${bus}</span></div>
      <div class="r"><span class="lab" style="color:var(--cyan)">Star</span><span class="bars">${Array.from({length:n},()=>'<i style="width:60%"></i>').join('')}</span><span class="num">${star}</span></div></div>
      <div class="xinfo">Example in units of cable. <b>Bus:</b> 1 main cable (6 units) + ${n} short cables (1 unit each) = <b>${bus}</b>. <b>Star:</b> ${n} cables of 6 units each = <b>${star}</b>. Add more computers and watch the gap grow.</div>`;
      $('#cm',box).onclick=()=>{n--;sfx.tap();draw()};$('#cp2',box).onclick=()=>{n++;sfx.tap();draw()};
    };
    draw();return;
  }
  if(t.type==='table'){
    const rows=[['Bus','One main cable','Cheap. Easy to set up. Uses less cable.','One break can stop all. Slows when busy. Hard to find faults.'],['Star','A central hub or switch','One failure does not stop the rest. Easy to add computers and find faults.','If the hub fails, all stop. Needs more cable.'],['Ring','A circle of computers','Orderly data. Fair turns. Steady when busy.','One break can stop the ring. Hard to fix and to change.']];
    box.innerHTML=`<div style="overflow-x:auto"><table class="cmp"><thead><tr><th>Topology</th><th>Shape</th><th>Advantages</th><th>Disadvantages</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
}

  3:[

   G('Bus, star or ring?','Which topology does each clue describe?',TOPCATS(),[...I(['If the hub fails, everything stops','Easy to add a computer and find faults','Needs more cable than a bus','A home Wi-Fi router works like this'],1),...I(['If the main cable breaks, everything stops','Terminators at both ends'],0),...I(['Computers pass data to their neighbours','Fair turns for every computer'],2)],9)],
  4:[

   G('Compare all three','Bus, star or ring?',TOPCATS(),[...I(['The cheapest layout','One main cable with terminators','Slows down when many computers send data'],0),...I(['The easiest to fix','A central hub','If the hub fails, all stop'],1),...I(['Every computer gets a fair turn','One break in the circle stops it','Data goes one way around'],2)],10),
   G('Best choice?','Which topology suits each situation?',TOPCATS(),[...I(['A tiny lab with 3 computers and not much money','The cheapest and simplest network'],0),...I(['An office where faults must be fixed quickly','A school that adds new computers often'],1),...I(['Every computer must get a fair turn','Data must move in order'],2)],6,'Which topology fits best?')]
  }[n];
}

async function finalRound(){
  document.title='Grand Challenge · Network Squad';paintHud();
  app.innerHTML='';await overlay('lose','Final round','Grand Challenge','10 questions. 25 seconds each.',2000);
  if(location.hash!=='#final')return;
  musicSet('battle');MU.mode='battle';
  app.innerHTML=`<div class="lh"><div class="eyebrow">All levels</div><h1><span class="skew">Grand Challenge</span></h1></div><div class="panel quest"><b>Beat the clock</b><span>10 mixed questions. Get 8 or more for the Grand Champion badge.</span></div><div class="w" id="fb" style="margin-top:16px;--acc:var(--violet)"></div><div class="row" style="padding-top:14px"><a class="btn gh" href="#map"><span>Back to map</span></a></div>`;
  const el=$('#fb');
  function go(){
    const all=[];for(let l=0;l<4;l++)for(let k=0;k<5;k++)all.push([l,k]);
    const qs=shuffle(all).slice(0,10).map(([l,k])=>mkQ(l,k));
    el.innerHTML='<div id="fq" style="display:grid;gap:14px"></div>';
    mcqRun($('#fq'),qs,{time:25,done:async(score,total,box)=>{
      const before=xpOf();S.final=Math.max(S.final,score);save();const gain=xpOf()-before;MU.mode='menu';
      box.innerHTML=`<div class="result"><div class="eyebrow">Grand Challenge</div><div class="big">${score}<span style="font-size:30px"> / ${total}</span></div>${gain>0?`<span class="xpg">+${gain} XP</span>`:''}<div class="byte" id="by2" style="width:100%"></div><div class="row" style="justify-content:flex-start"><button class="btn gh" id="re"><span>Play again</span></button><a class="btn" href="#map"><span>Back to map</span></a></div></div>`;
      say($('#by2',box),score>=8?'ok':'idle',score>=8?'Grand Champion! You really understand this. Check the leaderboard.':'Good try. Replay the levels you found hard, then come back.');
      $('#re',box).onclick=()=>{musicSet('battle');MU.mode='battle';go()};
      if(score>=8){sfx.win();burst(150)}else sfx.ok();paintHud();
    }});
  }
  go();
}
