<title>System Squad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: a game map of four levels (learn, play, boss) plus a grand challenge and a live class leaderboard. */
:root{
  --bg:#EDF2FF;--surface:#FFFFFF;--surface2:#E1E9FF;--fg:#101B3B;--muted:#4C5A84;--line:#C9D5F5;
  --blue:#3B6CFF;--blue-d:#2347C7;--blue-ink:#FFFFFF;--sun:#FFC21A;--sun-d:#C98F00;--sun-ink:#2B2000;
  --good:#0E9F5A;--good-d:#0A7442;--good-bg:#D7F5E5;--bad:#D92D20;--bad-d:#A11E14;--bad-bg:#FDE3E0;--violet:#6D4AE8;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--f-body:'Inter','Segoe UI',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1330;--surface:#162049;--surface2:#1F2B5E;--fg:#EEF2FF;--muted:#A5B3E3;--line:#2B3A75;
  --blue:#6F94FF;--blue-d:#4467D6;--blue-ink:#0A1233;--sun:#FFC21A;--sun-d:#B98400;--sun-ink:#2B2000;
  --good:#3DD68C;--good-d:#1E9A5F;--good-bg:#0F3A28;--bad:#FF7B6E;--bad-d:#C2453A;--bad-bg:#44201F;--violet:#A28BFF;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1330;--surface:#162049;--surface2:#1F2B5E;--fg:#EEF2FF;--muted:#A5B3E3;--line:#2B3A75;
  --blue:#6F94FF;--blue-d:#4467D6;--blue-ink:#0A1233;--sun:#FFC21A;--sun-d:#B98400;--sun-ink:#2B2000;
  --good:#3DD68C;--good-d:#1E9A5F;--good-bg:#0F3A28;--bad:#FF7B6E;--bad-d:#C2453A;--bad-bg:#44201F;--violet:#A28BFF;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
a{color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:var(--blue-ink);border:0;border-bottom:5px solid var(--blue-d);border-radius:14px;padding:12px 22px;font-weight:700;font-size:17px;text-decoration:none;min-height:50px}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.sun{background:var(--sun);color:var(--sun-ink);border-bottom-color:var(--sun-d)}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line);border-bottom-width:5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:2px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;background:none;border:0;padding:0;text-align:left;flex:none}
.me{display:flex;align-items:center;gap:8px;min-width:0;flex:1;justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;font-size:16px}
.xpw{display:grid;gap:2px;min-width:0;flex:0 1 150px}
.xpw .t{display:flex;justify-content:space-between;font-size:12px;font-weight:700;gap:6px}
.xpw .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:700;display:flex;align-items:center;gap:6px;font-size:14px}
.nav button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}

/* welcome */
.welcome{display:grid;gap:18px;padding-block:36px;justify-items:start}
.welcome h1{font-size:clamp(40px,10vw,68px);font-weight:800}
.welcome p{margin:0;max-width:46ch;font-size:19px;color:var(--muted)}
.field{display:grid;gap:6px;width:100%;max-width:420px}
.field label{font-weight:700}
input[type=text]{font:inherit;color:var(--fg);background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;font-size:19px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:46px;height:46px;border-radius:50%;border:4px solid transparent;padding:0}
.colors button[aria-pressed="true"]{border-color:var(--fg)}

/* map */
.hero{display:flex;gap:16px;align-items:center;padding-block:22px 6px}
.hero h1{font-size:clamp(30px,7vw,46px);font-weight:800}
.hero p{margin:4px 0 0;color:var(--muted)}
.path{display:grid;gap:14px;padding-block:14px}
.node{display:flex;align-items:center;gap:14px;background:var(--surface);border:3px solid var(--line);border-bottom-width:6px;border-radius:20px;padding:14px 16px;text-align:left;width:100%;min-width:0}
.node:not([disabled]):hover{border-color:var(--blue)}
.node[disabled]{opacity:.55;cursor:not-allowed}
.node .num{flex:none;width:58px;height:58px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px;border-bottom:4px solid var(--blue-d)}
.node.done .num{background:var(--good);border-bottom-color:var(--good-d);color:#fff}
.node.final .num{background:var(--violet);border-bottom-color:#4B2FB5;color:#fff}
.node .tx{flex:1;min-width:0}
.node h3{font-size:22px}
.node .tx small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.stars{display:flex;gap:2px;color:var(--line)}
.stars .on{color:var(--sun)}
.stars .ic{width:26px;height:26px;fill:currentColor;stroke:none}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.badge .ic{width:22px;height:22px}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge.on{border-color:var(--sun)}
.badge.on .ic{color:var(--sun-d)}

/* level */
.lh{padding-block:22px 4px;display:grid;gap:8px}
.lh h1{font-size:clamp(32px,7vw,52px);font-weight:800}
.lh .sub{color:var(--muted)}
.chips{display:flex;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:15;background:var(--bg);padding-block:10px}
.chips a{flex:1;text-align:center;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px;font-weight:700;text-decoration:none}
section{padding-block:18px;display:grid;gap:14px;scroll-margin-top:130px}
section>h2{font-size:28px}
.mission{background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:14px 16px;font-weight:600}
.mission b{font-family:var(--f-display);font-size:18px;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.flip{perspective:900px;background:none;border:0;padding:0;text-align:left;min-height:230px}
.flip .in{display:grid;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:250px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;border:3px solid var(--line);border-bottom-width:6px;}
.face.f{background:var(--surface);align-items:flex-start;justify-content:space-between}
.face.f .ic{width:44px;height:44px;color:var(--blue)}
.face.f h3{font-size:24px}
.face.f .tap{font-size:13px;font-weight:700;color:var(--muted)}
.face.b{background:var(--blue);color:var(--blue-ink);border-color:var(--blue-d);transform:rotateY(180deg);font-size:15.5px;line-height:1.45}
.face.b b{font-family:var(--f-display);font-size:19px}
.face.b .like{background:rgba(255,255,255,.18);border-radius:10px;padding:8px 10px;font-weight:600}
.cprog{font-weight:700;color:var(--muted)}

.w{background:var(--surface);border:3px solid var(--line);border-bottom-width:6px;border-radius:20px;padding:16px;display:grid;gap:14px;min-width:0}
.w h3{font-size:24px}
.w .hint{margin:0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,5.5vw,34px);text-align:center;padding:26px 14px;background:var(--surface2);border-radius:16px;min-height:104px;display:grid;place-items:center;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.opt{background:var(--surface);border:3px solid var(--line);border-bottom-width:6px;border-radius:14px;padding:12px 14px;text-align:left;font-weight:600;display:flex;gap:10px;align-items:center;min-height:56px}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt:active:not([disabled]){transform:translateY(3px);border-bottom-width:3px}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--fg)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}
.opt .m{margin-left:auto;font-weight:800;font-size:20px}
.opt.ok .m{color:var(--good)}.opt.no .m{color:var(--bad)}
.cats{display:flex;flex-wrap:wrap;gap:10px}
.cats .opt{flex:1 1 150px;justify-content:center;text-align:center}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qtext{font-size:22px;font-weight:700;line-height:1.35;margin:0;font-family:var(--f-display)}
.blank{display:inline-block;min-width:3.5em;border-bottom:4px solid var(--sun);text-align:center;margin-inline:2px}
.blank.f{color:var(--good);border-color:var(--good)}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--surface2);display:block}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{outline:3px solid var(--sun)}
.combo{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:var(--sun);color:var(--sun-ink);border-radius:99px;padding:3px 12px;font-size:15px;visibility:hidden}
.combo.on{visibility:visible;animation:pop .3s}
@keyframes pop{50%{transform:scale(1.2)}}
.pts{font-family:var(--f-mono);font-weight:700}
.timer{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--violet);width:100%}
.byte{display:flex;gap:10px;align-items:flex-start;min-height:64px}
.byte svg{flex:none;width:58px;height:58px}
.bubble{position:relative;background:var(--surface2);border-radius:14px;padding:10px 14px;font-weight:600;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-left:0;border-right-color:var(--surface2)}
.bubble.ok{background:var(--good-bg)}.bubble.ok::before{border-right-color:var(--good-bg)}
.bubble.no{background:var(--bad-bg)}.bubble.no::before{border-right-color:var(--bad-bg)}
.result{display:grid;gap:12px;justify-items:start}
.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1}
.miss{display:grid;gap:6px;width:100%}
.miss div{background:var(--bad-bg);border-radius:10px;padding:8px 12px;font-size:15px}
.xpgain{background:var(--sun);color:var(--sun-ink);font-weight:800;border-radius:99px;padding:4px 14px;display:inline-block}

/* stack, flow, boot, compress */
.stack{display:grid;gap:8px}
.layer{border-radius:14px;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;border:3px dashed var(--line);min-height:56px;color:var(--muted)}
.layer.placed{border-style:solid;color:#fff;border-color:transparent}
.layer.l3{background:#7A5AF8}.layer.l2{background:#3B6CFF}.layer.l1{background:#0E9F5A}.layer.l0{background:#E8590C}
.layer.act{outline:4px solid var(--sun);transform:scale(1.02)}
.layer small{font-weight:500;opacity:.9}
.pool{display:flex;gap:8px;flex-wrap:wrap}
.pool .opt{flex:1 1 200px}
.flowtext{background:var(--surface2);border-radius:14px;padding:14px 16px;font-weight:600;min-height:76px}
.boot{background:#0A0F24;color:#7CFFB2;border-radius:14px;padding:14px 16px;font-family:var(--f-mono);font-size:14px;min-height:150px;line-height:1.7;overflow-wrap:anywhere}
.boot .e{color:#FF8B7E}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.apps button{background:var(--surface2);border:3px solid var(--line);border-radius:16px;padding:12px 4px;display:grid;gap:4px;justify-items:center;font-weight:700;font-size:13px}
.apps button .ic{width:34px;height:34px}
.apps button[disabled]{opacity:.35;cursor:not-allowed}
.sw{display:inline-flex;gap:10px;align-items:center;font-weight:700;background:var(--surface);border:3px solid var(--line);border-radius:99px;padding:6px 16px 6px 8px}
.sw i{width:42px;height:24px;border-radius:99px;background:var(--bad);position:relative;display:block}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-pressed="true"] i{background:var(--good)}.sw[aria-pressed="true"] i::after{left:21px}
.files{display:grid;gap:8px}
.file{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:12px;padding:10px 14px;font-weight:600}
.file .bar2{flex:1;height:14px;background:var(--bg);border-radius:99px;overflow:hidden}
.file .bar2 i{display:block;height:100%;background:var(--blue);transition:width .6s}
.file .mb{font-family:var(--f-mono);font-weight:700;min-width:68px;text-align:right}
.limit{display:flex;justify-content:space-between;font-weight:700;background:var(--bg);border-radius:12px;padding:10px 14px;border:3px solid var(--line)}
.limit.okk{border-color:var(--good);background:var(--good-bg)}.limit.bad{border-color:var(--bad);background:var(--bad-bg)}

/* leaderboard */
.board{display:grid;gap:8px}
.pl{display:flex;align-items:center;gap:12px;background:var(--surface);border:3px solid var(--line);border-radius:16px;padding:10px 14px;min-width:0}
.pl.me{border-color:var(--blue);background:var(--surface2)}
.pl .rk{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--surface2)}
.pl:nth-child(1) .rk{background:var(--sun);color:var(--sun-ink)}
.pl:nth-child(2) .rk{background:#C8D0E6;color:#1B2440}
.pl:nth-child(3) .rk{background:#E3A26B;color:#2B1500}
.pl .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .nm small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.pl .xp{font-family:var(--f-mono);font-weight:700}
.rm{background:none;border:2px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px}
.note{background:var(--surface2);border-radius:14px;padding:12px 16px;font-size:15px}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tally div{background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:10px 14px}
.tally b{display:block;font-family:var(--f-display);font-size:30px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (max-width:520px){.xpw{display:none}.brand{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

he computer.","o":["user interface","keyboard only","printer only","speaker only"]},{"q":"Without an operating system, a computer _____.","o":["can run any software easily","cannot start up or run application software","becomes faster","becomes a calculator only"]},{"q":"Managing files and folders on a computer is a function of the _____.","o":["operating system","printer","scanner","speaker"]}],[{"q":"Which of these is a mobile operating system?","o":["Android","Windows Server","Linux Server","DOS"]},{"q":"An operating system that allows only one user to work at a time is called a _____ operating system.","o":["single-user","multi-user","network","mobile"]},{"q":"Which of the following is an example of a desktop operating system?","o":["iOS","Windows","Android","Symbian"]},{"q":"An operating system that manages several computers connected in a network is called a _____ operating system.","o":["network","single-user","mobile","game"]},{"q":"iOS is the mobile operating system developed mainly for _____ devices.","o":["Apple","Samsung","Tecno","Infinix"]}]];

 ['Software is the set of instructions and programs. You cannot touch it. The physical parts are hardware.','Windows is an operating system, and an operating system is system software. Word, a browser and a calculator app are application software.','Microsoft Excel is for spreadsheets, a job a user wants done. Linux, macOS and Windows are operating systems.','System software manages and controls the hardware so that application software can run.','You can touch hardware like a keyboard. Software is instructions, so you cannot touch it.'],

 {id:1,name:'Meet the Software',wp:'Week 6 · Period 1',topic:'System Software and Application Software',badge:'Software Spotter',

function xpOf(){
  let x=0;

}

function badges(){
  const b=LEVELS.map((l,i)=>({n:l.badge,ic:['code','tool','gear','phone'][i],on:(S.boss[l.id]||0)>=3}));

/* ---------- sound & confetti ---------- */
let AC=null;
function tone(f,t,d,type='sine',v=.12){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}
}
const sfx={ok(){tone(660,0,.12);tone(880,.1,.18)},no(){tone(180,0,.25,'sawtooth',.07)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.25))}};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function burst(n=70){
  if(RM)return;const cv=$('#fx'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cs=['#FFC21A','#3B6CFF','#0E9F5A','#E8590C','#7A5AF8','#D6336C'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:4+Math.random()*5,c:cs[Math.random()*6|0],a:Math.random()*6}));
  let f=0;(function step(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.a+=.2;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++f<80)requestAnimationFrame(step);else cx.clearRect(0,0,cv.width,cv.height)})();
}

function done(l){return (S.boss[l]||0)>=3}
function stars(n){return `<span class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(i=>`<span class="${n>=i?'on':''}">${ic('star')}</span>`).join('')}</span>`}
const starsFor=l=>{const b=S.boss[l]||0;return b>=5?3:b>=4?2:b>=3?1:0};

/* ---------- MCQ runner (boss + final) ---------- */
function mcqRun(el,qs,opt){
  let i=0,score=0,hist=[],timer=null,left=0;
  const dots=()=>`<div class="dots">${qs.map((_,k)=>`<i class="${hist[k]===undefined?(k===i?'cur':''):hist[k]?'ok':'no'}"></i>`).join('')}</div>`;
  function draw(){
    clearInterval(timer);
    if(i>=qs.length)return opt.done(score,qs.length,el);
    const q=qs[i];
    el.innerHTML=`<div class="row"><span class="eyebrow">Question ${i+1} of ${qs.length}</span>${dots()}</div>${opt.time?'<div class="timer" aria-hidden="true"><i id="tm"></i></div>':''}
    <p class="qtext" id="qt">${esc(q.q).replace(/_{3,}/,'<span class="blank">&nbsp;</span>')}</p>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span>${esc(o.t)}</span><span class="m"></span></button>`).join('')}</div>
    <div class="byte" id="by"></div><div id="nx"></div>`;
    say($('#by',el),'idle',opt.time?'Be quick, but think!':'Take your time. Think about what you learned.');
    const lock=pickedOk=>{
      clearInterval(timer);
      el.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(q.opts[k].ok){x.classList.add('ok');x.querySelector('.m').textContent='✓'}});
      const right=q.opts.find(x=>x.ok).t;$('#qt',el).innerHTML=esc(q.q).replace(/_{3,}/,`<span class="blank f">${esc(right)}</span>`);
      hist[i]=pickedOk;if(pickedOk){score++;sfx.ok()}else sfx.no();
      say($('#by',el),pickedOk?'ok':'no',(pickedOk?pick(CHEER):pick(OOPS))+' '+q.why);
      $('#nx',el).innerHTML=`<button class="btn" id="n">${i===qs.length-1?'See my result':'Next question'}</button>`;
      const n=$('#n',el);n.onclick=()=>{i++;draw()};n.focus({preventScroll:true});
    };
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=q.opts[+b.dataset.k];if(!o.ok)b.classList.add('no'),b.querySelector('.m').textContent='✗';lock(o.ok)});
    if(opt.time){left=opt.time;const t0=Date.now();timer=setInterval(()=>{const f=1-(Date.now()-t0)/(opt.time*1000);const tm=$('#tm',el);if(tm)tm.style.width=Math.max(0,f*100)+'%';if(f<=0){clearInterval(timer);lock(false)}},100)}
  }
  draw();
}
function mkQ(l,k){const m=MCQ[l].mcq?MCQ[l].mcq[k]:MCQ[l][k];return {q:m.q,opts:shuffle(m.o.map((t,j)=>({t,ok:j===ANS[l][k]}))),why:WHY[l][k]}}

function boss(el,n){
  const l=n-1;
  function start(){
    el.className='w';
    const qs=shuffle([0,1,2,3,4]).map(k=>mkQ(l,k));
    el.innerHTML=`<div id="bq"></div>`;
    mcqRun($('#bq',el),qs,{done:(score,total,box)=>{
      const prev=S.boss[n]||0,first=!done(n);
      const before=xpOf();S.boss[n]=Math.max(prev,score);save();paintMe();
      const gain=xpOf()-before;
      if(score>=3&&first){sfx.win();burst(110)}else if(score===5){sfx.win();burst(80)}
      const ok=score>=3;
      box.innerHTML=`<div class="result"><div class="eyebrow">Boss result</div><div class="score">${score}<span style="font-size:30px;color:var(--muted)"> / ${total}</span></div>${stars(score>=5?3:score>=4?2:score>=3?1:0)}
      ${gain>0?`<span class="xpgain">+${gain} XP</span>`:''}
      <div class="byte" id="by2" style="width:100%"></div>
      <div class="row"><button class="btn ${ok?'ghost':''}" id="re">Try again</button>${ok&&n<4?`<a class="btn sun" href="#l${n+1}">Next level</a>`:''}${ok&&n===4?`<a class="btn sun" href="#final">Grand Challenge</a>`:''}</div></div>`;
      say($('#by2',box),ok?'ok':'no',score===5?'PERFECT! Nobody beats that. Go and tell your friends.':ok?'Boss defeated! Level cleared. Next level is now open. Try again for more stars if you like.':'The boss survived this time. Flip the cards again, play the games, and come back. You can do it.');
      $('#re',box).onclick=start;
    }});
  }
  start();
}

/* ---------- sort game engine ---------- */
function sortGame(def){
  return (el,n,gi)=>{
    let deck,i,pts,ok,combo,miss,best;const key=n+'.'+gi;
    function start(){deck=shuffle(def.items).slice(0,def.n||8);i=0;pts=0;ok=0;combo=0;miss=[];best=0;draw()}
    function draw(){
      if(i>=deck.length)return finish();
      const it=deck[i];
      el.innerHTML=`<h3>${esc(def.title)}</h3><p class="hint">${esc(def.intro)}</p>
      <div class="row"><span class="eyebrow">${i+1} of ${deck.length}</span><span class="combo ${combo>=2?'on':''}">${ic('flame')} Combo x${combo}</span><span class="pts">${pts} pts</span></div>
      <div class="big">${esc(it.t)}</div>
      <div class="cats">${def.cats.map((c,k)=>`<button class="opt" data-k="${k}">${esc(c.n)}</button>`).join('')}</div>
      <div class="byte" id="by"></div><div id="nx"></div>`;
      say($('#by',el),'idle',def.prompt||'Which one is it? Tap your answer.');
      el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        const k=+b.dataset.k,right=k===it.c;
        el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===it.c)x.classList.add('ok')});
        if(right){combo++;best=Math.max(best,combo);ok++;pts+=10+Math.min(combo-1,5)*2;sfx.ok();if(combo&&combo%5===0)burst(40)}else{b.classList.add('no');combo=0;miss.push(it);sfx.no()}
        say($('#by',el),right?'ok':'no',(right?pick(CHEER):pick(OOPS))+' '+def.cats[it.c].n+': '+def.cats[it.c].info);
        $('#nx',el).innerHTML=`<button class="btn" id="n">${i===deck.length-1?'Finish':'Next'}</button>`;
        const nb=$('#n',el);nb.onclick=()=>{i++;draw()};nb.focus({preventScroll:true});
      });
    }
    function finish(){
      const prev=S.games[key]||0;const gain=Math.max(0,pts-prev);
      S.games[key]=Math.max(prev,pts);S.best=Math.max(S.best,best);save();paintMe();
      if(ok===deck.length){sfx.win();burst(80)}
      el.innerHTML=`<h3>${esc(def.title)}</h3><div class="result"><div class="eyebrow">Result</div><div class="score">${ok}<span style="font-size:30px;color:var(--muted)"> / ${deck.length}</span></div><span class="pts">${pts} points · best combo x${best}</span>${gain>0?`<span class="xpgain">+${gain} XP</span>`:`<span class="hint">Beat your best of ${prev} points to earn more XP.</span>`}
      ${miss.length?`<div class="miss">${miss.map(m=>`<div>${esc(m.t)} belongs with <b>${esc(def.cats[m.c].n)}</b></div>`).join('')}</div>`:''}
      <button class="btn" id="re">Play again</button></div>`;
      $('#re',el).onclick=start;
    }
    start();
  };
}

/* ---------- special widgets ---------- */
function stackGame(el,n,gi){
  const layers=[['Hardware','The touchable parts: screen, keyboard, processor','l0'],['Operating system','System software that runs the hardware','l1'],['Application software','Word, Excel, browsers','l2'],['You, the user','Tapping, typing and clicking','l3']];
  let placed=0,mistakes=0;
  function draw(finished){
    const pool=layers.map((l,i)=>[l,i]).filter(([,i])=>i>=placed);
    el.innerHTML=`<h3>Build the computer stack</h3><p class="hint">A computer works in layers. Tap the layers one at a time, starting from the very bottom.</p>
    <div class="stack">${layers.slice().reverse().map((l,ri)=>{const i=3-ri;return `<div class="layer ${i<placed?'placed '+l[2]:''}"><span>${i<placed?l[0]:'Empty slot'}</span><small>${i<placed?l[1]:'Layer '+(i+1)+' from the bottom'}</small></div>`}).join('')}</div>
    ${finished?'':`<div class="pool">${shuffle(pool).map(([l,i])=>`<button class="opt" data-i="${i}">${l[0]}</button>`).join('')}</div>`}
    <div class="byte" id="by"></div>`;
    say($('#by',el),finished?'ok':'idle',finished?'Perfect stack! You talk to apps, apps talk to the operating system, and the operating system controls the hardware.':'Think: what must exist first before anything else can run?');
    el.querySelectorAll('.pool .opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===placed){placed++;sfx.ok();if(placed===4){const pts=Math.max(10,40-mistakes*10);const prev=S.games[n+'.'+gi]||0;S.games[n+'.'+gi]=Math.max(prev,pts);save();paintMe();burst(60);sfx.win();draw(true);return}draw(false)}
      else{mistakes++;b.classList.add('no');sfx.no();say($('#by',el),'no','Not yet. Which layer sits underneath everything else?')}
    });
  }
  draw(false);
}
function flowGame(el,n,gi){
  const steps=[[3,'You tap the Word icon.'],[2,'Word (application software) asks the operating system for a place to run.'],[1,'The operating system gives Word some memory and tells the processor to start it.'],[0,'The hardware does the work. The screen lights up with a blank page.'],[1,'The operating system sends the picture to the screen. You see Word, ready to type. Without the OS in the middle, none of this would happen.']];
  let k=0;
  function draw(){
    const act=steps[k][0];
    el.innerHTML=`<h3>Follow a tap</h3><p class="hint">What happens inside the computer when you open Word? Step through it.</p>
    <div class="stack">${[3,2,1,0].map(i=>{const L=[['Hardware','l0'],['Operating system','l1'],['Application software','l2'],['You','l3']][i];return `<div class="layer placed ${L[1]} ${i===act?'act':''}"><span>${L[0]}</span></div>`}).join('')}</div>
    <div class="flowtext" aria-live="polite">Step ${k+1} of ${steps.length}. ${steps[k][1]}</div>
    <div class="row"><button class="btn ghost" id="pv" ${k?'':'disabled'}>Back</button><button class="btn" id="nx">${k<steps.length-1?'Next step':'Start again'}</button></div>`;
    $('#pv',el).onclick=()=>{k--;draw()};
    $('#nx',el).onclick=()=>{if(k<steps.length-1){k++;sfx.ok();if(k===steps.length-1){const prev=S.games[n+'.'+gi]||0;if(!prev){S.games[n+'.'+gi]=15;save();paintMe()}}}else k=0;draw()};
  }
  draw();
}
function compressGame(el,n,gi){
  const F=[['Class photos',18],['Project video',30],['Notes (Word)',4]];let comp=false;const sel=[true,true,true];
  function draw(){
    const size=f=>comp?f*0.45:f;
    const tot=F.reduce((a,f,i)=>a+(sel[i]?size(f[1]):0),0);const ok=tot<=25&&sel.some(Boolean);
    el.innerHTML=`<h3>Squeeze the files</h3><p class="hint">You must email your project, but the email limit is 25 MB. Tick the files, then press Compress.</p>
    <div class="files">${F.map((f,i)=>`<label class="file"><input type="checkbox" data-i="${i}" ${sel[i]?'checked':''} style="width:22px;height:22px"><span style="flex:0 0 120px">${f[0]}</span><span class="bar2"><i style="width:${size(f[1])/30*100}%"></i></span><span class="mb">${size(f[1]).toFixed(1)} MB</span></label>`).join('')}</div>
    <div class="limit ${comp?(ok?'okk':'bad'):''}"><span>Total: ${tot.toFixed(1)} MB</span><span>Limit: 25 MB</span></div>
    <div class="row"><button class="btn" id="cz">${comp?'Un-compress':'Compress'}</button></div>
    <div class="byte" id="by"></div>`;
    say($('#by',el),comp?(ok?'ok':'no'):'idle',comp?(ok?'It fits! File compression reduces size so files are easier to store or share. (Real results vary by file type.)':'Still too big. Un-tick a file, or ask yourself what else could be removed.'):'Right now the total is too big. Which utility program helps?');
    el.querySelectorAll('input').forEach(c=>c.onchange=()=>{sel[+c.dataset.i]=c.checked;draw()});
    $('#cz',el).onclick=()=>{comp=!comp;draw();const t=F.reduce((a,f,i)=>a+(sel[i]?f[1]*.45:0),0);if(comp&&t<=25&&sel.every(Boolean)){const prev=S.games[n+'.'+gi]||0;if(!prev){S.games[n+'.'+gi]=20;save();paintMe();burst(50);sfx.win()}}};
  }
  draw();
}
function bootGame(el,n,gi){
  let os=true,state='off',timers=[];
  const logs=[['BIOS check ... OK',0],['Loading operating system ...',500],['Memory ready ... OK',1000],['Keyboard and mouse found ... OK',1500],['Screen ready ... OK',2000],['Welcome! Your desktop is ready.',2500]];
  function draw(lines){
    el.innerHTML=`<h3>Switch on, with and without an OS</h3><p class="hint">Turn the operating system off, press power, and see what happens to the apps.</p>
    <div class="row"><button class="sw" id="os" aria-pressed="${os}"><i></i>Operating system installed</button><button class="btn" id="pw">Press power</button></div>
    <div class="boot" id="bt" aria-live="polite">${lines||'Computer is off.'}</div>
    <div class="apps">${[['doc','Word'],['globe','Browser'],['calc','Calculator'],['camera','Camera']].map(a=>`<button data-a="${a[1]}" ${state==='on'?'':'disabled'}>${ic(a[0])}${a[1]}</button>`).join('')}</div>
    <div class="byte" id="by"></div>`;
    say($('#by',el),state==='err'?'no':state==='on'?'ok':'idle',state==='err'?'Without an operating system, the computer cannot start up or run any application. The hardware is fine, but nothing manages it.':state==='on'?'The operating system started everything: memory, keyboard, screen and apps.':'Try it both ways.');
    $('#os',el).onclick=()=>{os=!os;state='off';timers.forEach(clearTimeout);draw()};
    $('#pw',el).onclick=run;
    el.querySelectorAll('.apps button').forEach(b=>b.onclick=()=>{say($('#by',el),'ok',b.dataset.a+' is open. The OS gave it memory and let it use the screen.')});
  }
  function run(){
    timers.forEach(clearTimeout);state='boot';
    if(!os){draw('Power on ...<br>Looking for an operating system ...<br><span class="e">ERROR: No operating system found. Cannot start.</span>');state='err';draw('Power on ...<br>Looking for an operating system ...<br><span class="e">ERROR: No operating system found. Cannot start.</span>');mark();return}
    let acc=[];draw('Power on ...');
    logs.forEach(([t,d],k)=>timers.push(setTimeout(()=>{acc.push(t);$('#bt',el)&&($('#bt',el).innerHTML='Power on ...<br>'+acc.join('<br>'));if(k===logs.length-1){state='on';draw('Power on ...<br>'+acc.join('<br>'));mark()}},d+200)));
  }
  function mark(){S.bootSeen=S.bootSeen||{};S.bootSeen[os?'on':'off']=true;if(S.bootSeen.on&&S.bootSeen.off&&!S.games[n+'.'+gi]){S.games[n+'.'+gi]=20;save();paintMe();burst(50);sfx.win()}}
  draw();
}

/* ---------- sort data ---------- */
const C=(n,info)=>({n,info});
const I=(arr,c)=>arr.map(t=>({t,c}));

  const W={
  1:[stackGame,flowGame,G('Hardware, system or application?','Sort each item. Build a combo by getting answers right in a row.',[C('Hardware','the physical parts you can touch.'),C('System software','manages and controls the hardware so apps can run.'),C('Application software','helps a user do a specific task.')],[...I(['Keyboard','Computer screen','Mouse','Printer'],0),...I(['Windows','macOS','Linux'],1),...I(['Microsoft Word','Microsoft Excel','A web browser','Calculator app'],2)],9)],
  2:[G('Tech Doctor','Each patient has a problem. Choose the utility program that fixes it.',[C('Antivirus','detects and removes harmful software.'),C('Disk cleanup','removes unnecessary files to free up space.'),C('File compression','makes files smaller to store or share.'),C('Backup software','copies important data to another place for safekeeping.')],[...I(['A virus has infected your flash drive','Your computer shows strange pop-ups from harmful software','You must find and remove malware'],0),...I(['Phone storage is full of junk files','The computer is slow because it is full of unnecessary files','You need to free up storage space'],1),...I(['The folder is too large to email','You want to share photos on a slow network','Make a file smaller to store it'],2),...I(['Your laptop may get lost, so you copy results elsewhere','Save a second copy of your project to a flash drive','Protect your important data from loss'],3)],8,'Which utility program is the right treatment?'),compressGame],
  3:[G('Run the school','You are the operating system. A request just arrived. Which OS job handles it?',[C('Memory and processor','the OS decides how much memory and processing time each program gets.'),C('Devices','the OS controls input and output devices.'),C('Files and folders','the OS stores and organises files.'),C('User interface','the OS gives you icons, menus and screens to talk to.'),C('Security','the OS controls who is allowed to use the system.')],[...I(['Two programs need memory at the same time','Decide which program the processor works on next'],0),...I(['Press Print and the printer starts','Plug in a keyboard and it works','Show the picture on the monitor'],1),...I(['Save your assignment in a folder','Find a file by its name'],2),...I(['Tap an icon to open an app','Open a menu with a mouse click'],3),...I(['Ask for a password before opening','Stop a stranger from using the computer'],4)],10,'Which operating system job is this?'),bootGame],
  4:[G('Which type of OS?','Match each description to a type of operating system.',[C('Single-user','only one person can work at a time.'),C('Multi-user','several users share the computer\'s resources at the same time.'),C('Mobile','designed for smartphones and tablets.'),C('Network','manages and coordinates connected computers.')],[...I(['Windows on one student laptop','Only one person can work at a time'],0),...I(['A large server used by many people at once','Common on big servers'],1),...I(['Android on a phone','iOS on an iPhone','Runs on tablets and smartphones'],2),...I(['Coordinates the computers in a school network','Manages computers that are connected together'],3)],9),G('Name that OS','Is it a mobile operating system or one for desktop and laptop computers?',[C('Mobile OS','designed for phones and tablets.'),C('Desktop OS','runs on desktop and laptop computers.')],[...I(['Android','iOS'],0),...I(['Windows','macOS','Linux'],1)],5)]

/* ---------- grand challenge ---------- */
function finalRound(){
  document.title='Grand Challenge · System Squad';
  app.innerHTML=`<div class="lh"><div class="eyebrow">All levels</div><h1>Grand Challenge</h1></div><div class="mission"><b>10 questions. 25 seconds each.</b>Mixed questions from all four levels. Get 8 or more for the Grand Champion badge.</div><div class="w" id="fb" style="margin-top:14px"></div><div class="row" style="padding-top:12px"><a class="btn ghost" href="#map">Back to map</a></div>`;
  const el=$('#fb');
  function start(){
    const all=[];for(let l=0;l<4;l++)for(let k=0;k<5;k++)all.push([l,k]);
    const qs=shuffle(all).slice(0,10).map(([l,k])=>mkQ(l,k));
    el.innerHTML='<div id="fq"></div>';
    mcqRun($('#fq'),qs,{time:25,done:(score,total,box)=>{
      const before=xpOf();S.final=Math.max(S.final,score);save();paintMe();const gain=xpOf()-before;
      if(score>=8){sfx.win();burst(120)}
      box.innerHTML=`<div class="result"><div class="eyebrow">Grand Challenge</div><div class="score">${score}<span style="font-size:30px;color:var(--muted)"> / ${total}</span></div>${gain>0?`<span class="xpgain">+${gain} XP</span>`:''}<div class="byte" id="by2" style="width:100%"></div><div class="row"><button class="btn" id="re">Play again</button><a class="btn sun" href="#board">See the leaderboard</a></div></div>`;
      say($('#by2',box),score>=8?'ok':'idle',score>=8?'Grand Champion! You really understand this. Check where you are on the leaderboard.':'Good try. Replay the levels you found hard, then come back.');
      $('#re',box).onclick=start;
    }});
  }
  start();
}

/* ---------- leaderboard (shared db) ---------- */
let DB=null,USER=null,UID=null,lastSent='',syncT=null,live=null,players=[],dbState='loading',IS_OWNER=false;
async function initDB(){
  try{
    const c=window.claude;if(!c||!c.use){dbState='off';return}
    USER=await c.use('user');DB=await c.use('db');
    if(!USER||!DB){dbState='off';return}
    UID=await USER.id();IS_OWNER=await USER.isOwner();
    if(!UID){dbState='off';return}
    dbState='on';
    live=DB.collection('players').orderBy('xp','desc').limit(60).onSnapshot(s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));if(route.cur==='board')leaderboard(true)},()=>{dbState='err';if(route.cur==='board')leaderboard(true)});
    syncSoon();
  }catch(e){dbState='off'}
  if(route.cur==='board')leaderboard(true);
}
function syncSoon(){
  if(dbState!=='on'||!S.name)return;
  clearTimeout(syncT);syncT=setTimeout(async()=>{
    const x=xpOf();const doc={name:S.name,color:S.color,xp:x,lv:lvlOf(x),badges:badges().filter(b=>b.on).length,stars:LEVELS.reduce((a,l)=>a+starsFor(l.id),0),t:Date.now()};
    const sig=[doc.name,doc.color,doc.xp,doc.badges].join('|');if(sig===lastSent)return;
    try{await DB.doc('players/'+UID).set(doc);lastSent=sig}catch(e){if(e&&e.code==='invalid_argument')dbState='readonly'}
  },1500);
}
function leaderboard(soft){
  document.title='Leaderboard · System Squad';
  const mine=players.find(p=>p.id===UID);
  const list=dbState==='on'||dbState==='readonly'?players:[{id:'me',name:S.name,color:S.color,xp:xpOf(),lv:lvlOf(xpOf()),badges:badges().filter(b=>b.on).length}];
  const total=list.reduce((a,p)=>a+(p.xp||0),0);
  const msg={off:'The class leaderboard is not connected. Your points are still saved on this tablet. Ask your teacher to share this page with "Contributor" access.',readonly:'You can see the leaderboard, but your score cannot be saved. Ask your teacher for "Contributor" access.',err:'The leaderboard could not load. Your points are still saved on this tablet.',loading:'Loading the leaderboard ...',on:''}[dbState];
  app.innerHTML=`<div class="lh"><div class="eyebrow">Live for the whole class</div><h1>Leaderboard</h1></div>
  <div class="tally"><div><b>${list.length}</b>players</div><div><b>${total}</b>class XP together</div><div><b>${xpOf()}</b>your XP</div></div>
  ${msg?`<div class="note">${esc(msg)}</div>`:''}
  <div class="board" style="padding-top:14px">${list.length?[...list].sort((a,b)=>(b.xp||0)-(a.xp||0)).map((p,i)=>`<div class="pl ${p.id===UID||p.id==='me'?'me':''}"><span class="rk">${i+1}</span><span class="av" style="background:${esc(p.color||'#3B6CFF')}">${esc((p.name||'?')[0].toUpperCase())}</span><span class="nm">${esc(p.name||'Player')}${p.id===UID||p.id==='me'?' (you)':''}<small>Level ${p.lv||1} · ${p.badges||0} badges</small></span><span class="xp">${p.xp||0} XP</span>${IS_OWNER&&p.id!==UID&&p.id!=='me'?`<button class="rm" data-id="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">Remove</button>`:''}</div>`).join(''):'<div class="note">No players yet. Earn some XP and you will appear here.</div>'}</div>`;
  app.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await DB.doc('players/'+b.dataset.id).delete()}catch(e){b.disabled=false}});
  if(!soft)window.scrollTo(0,0);
}
route();initDB();
